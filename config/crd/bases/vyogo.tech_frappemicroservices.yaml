---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: frappemicroservices.vyogo.tech
spec:
  group: vyogo.tech
  names:
    kind: FrappeMicroservice
    listKind: FrappeMicroserviceList
    plural: frappemicroservices
    shortNames:
    - fms
    singular: frappemicroservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.siteRef.name
      name: Site
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.serviceURL
      name: Service URL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          FrappeMicroservice runs a frappe-microservice-lib image bound to an existing
          FrappeSite through a generated site binding Secret, as a Deployment (with a
          ClusterIP Service and optional routing on the site's domain), a Job or a
          CronJob.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FrappeMicroserviceSpec defines the desired state of FrappeMicroservice.
            properties:
              args:
                description: Args passed to the command.
                items:
                  type: string
                type: array
              command:
                description: |-
                  Command overrides the image entrypoint. Required for Job and CronJob,
                  because the library's default entrypoint starts a long-running server.
                items:
                  type: string
                type: array
              cronJob:
                description: CronJob schedule. Required when type is CronJob.
                properties:
                  concurrencyPolicy:
                    default: Forbid
                    description: ConcurrencyPolicy for overlapping runs.
                    enum:
                    - Allow
                    - Forbid
                    - Replace
                    type: string
                  failedJobsHistoryLimit:
                    description: FailedJobsHistoryLimit is how many finished failed
                      Jobs to keep.
                    format: int32
                    minimum: 0
                    type: integer
                  schedule:
                    description: Schedule in cron format, e.g. "0 2 * * *".
                    minLength: 1
                    type: string
                  startingDeadlineSeconds:
                    description: |-
                      StartingDeadlineSeconds after a missed schedule, beyond which the run is
                      skipped.
                    format: int64
                    minimum: 0
                    type: integer
                  successfulJobsHistoryLimit:
                    description: SuccessfulJobsHistoryLimit is how many finished successful
                      Jobs to keep.
                    format: int32
                    minimum: 0
                    type: integer
                  suspend:
                    description: Suspend pauses future runs.
                    type: boolean
                  timeZone:
                    description: |-
                      TimeZone for the schedule, e.g. "Australia/Sydney". Defaults to the
                      kube-controller-manager's time zone.
                    type: string
                required:
                - schedule
                type: object
              deployment:
                description: Deployment settings. Only valid when type is Deployment.
                properties:
                  autoscaling:
                    description: |-
                      Autoscaling lets a HorizontalPodAutoscaler (CPU or memory) or a KEDA
                      ScaledObject (event-driven), both owned by the operator, scale the
                      Deployment. The operator then sets the Deployment's replicas only when it
                      creates it, so it and the autoscaler never fight over the count.
                    properties:
                      keda:
                        description: |-
                          Keda scales the Deployment with a KEDA ScaledObject instead of a
                          HorizontalPodAutoscaler. Needs KEDA installed in the cluster.
                        properties:
                          cooldownPeriod:
                            description: |-
                              CooldownPeriod in seconds to wait after the last active trigger before
                              scaling back to minReplicas. KEDA defaults to 300.
                            format: int32
                            minimum: 0
                            type: integer
                          pollingInterval:
                            description: PollingInterval in seconds between trigger
                              checks. KEDA defaults to 30.
                            format: int32
                            minimum: 1
                            type: integer
                          triggers:
                            description: Triggers decide the replica count, e.g. a
                              redis list length.
                            items:
                              description: MicroserviceKEDATrigger is one KEDA scaler.
                              properties:
                                authenticationRef:
                                  description: |-
                                    AuthenticationRef names a KEDA TriggerAuthentication in this namespace
                                    that supplies the scaler's credentials.
                                  type: string
                                metadata:
                                  additionalProperties:
                                    type: string
                                  description: Metadata is the scaler configuration,
                                    passed to KEDA as is.
                                  type: object
                                name:
                                  description: Name of the trigger, unique within
                                    the ScaledObject. Optional.
                                  type: string
                                type:
                                  description: Type of the KEDA scaler, e.g. redis,
                                    cpu, prometheus.
                                  minLength: 1
                                  type: string
                              required:
                              - type
                              type: object
                            maxItems: 16
                            minItems: 1
                            type: array
                        required:
                        - triggers
                        type: object
                      maxReplicas:
                        description: MaxReplicas is the upper bound.
                        format: int32
                        minimum: 1
                        type: integer
                      minReplicas:
                        description: MinReplicas is the lower bound. Defaults to 1.
                        format: int32
                        minimum: 0
                        type: integer
                      targetCPUUtilizationPercentage:
                        description: |-
                          TargetCPUUtilizationPercentage is the average CPU utilization, relative
                          to resources.requests.cpu, the HorizontalPodAutoscaler aims for.
                        format: int32
                        maximum: 1000
                        minimum: 1
                        type: integer
                      targetMemoryUtilizationPercentage:
                        description: |-
                          TargetMemoryUtilizationPercentage is the average memory utilization,
                          relative to resources.requests.memory, the HorizontalPodAutoscaler aims
                          for.
                        format: int32
                        maximum: 1000
                        minimum: 1
                        type: integer
                    required:
                    - maxReplicas
                    type: object
                    x-kubernetes-validations:
                    - message: minReplicas must not exceed maxReplicas
                      rule: '!has(self.minReplicas) || self.minReplicas <= self.maxReplicas'
                    - message: minReplicas must be at least 1 unless keda is set (only
                        KEDA can scale to zero)
                      rule: has(self.keda) || !has(self.minReplicas) || self.minReplicas
                        >= 1
                    - message: set a CPU or memory utilization target, or keda with
                        at least one trigger
                      rule: 'has(self.keda) ? size(self.keda.triggers) > 0 : (has(self.targetCPUUtilizationPercentage)
                        || has(self.targetMemoryUtilizationPercentage))'
                    - message: keda cannot be combined with CPU or memory targets;
                        use a cpu or memory KEDA trigger instead
                      rule: '!has(self.keda) || (!has(self.targetCPUUtilizationPercentage)
                        && !has(self.targetMemoryUtilizationPercentage))'
                  port:
                    default: 8000
                    description: |-
                      Port the container listens on and the Service exposes. The operator passes
                      it to the container as PORT.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  replicas:
                    default: 1
                    description: |-
                      Replicas of the Deployment. With autoscaling set, the autoscaler owns the
                      replica count and this value applies only once autoscaling is removed.
                    format: int32
                    minimum: 0
                    type: integer
                  routing:
                    description: |-
                      Routing exposes path prefixes on the site's domain. When omitted, the
                      microservice is only reachable in-cluster through its ClusterIP Service.
                    properties:
                      paths:
                        description: |-
                          Paths are URL path prefixes on the site's domain that are routed to this
                          microservice instead of the monolith. Matching uses Ingress `Prefix`
                          semantics: `/orders` matches `/orders` and `/orders/...`, not
                          `/orders-report`.

                          Validation only looks at this object. Two microservices claiming the same
                          path on one site are not detected by the operator; the ingress controller
                          (or an API gateway in front of it) decides which one wins.
                        items:
                          maxLength: 256
                          type: string
                        maxItems: 16
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: set
                        x-kubernetes-validations:
                        - message: each path must be an absolute path made of non-empty
                            segments of [A-Za-z0-9._~%-], with no trailing slash;
                            '/' is not allowed
                          rule: self.all(p, p.matches('^(/[A-Za-z0-9._~%-]+)+$'))
                        - message: paths must not contain dot segments ('.' or '..')
                          rule: self.all(p, !p.matches('/[.][.]?(/|$)'))
                        - message: 'paths must not overlap reserved monolith routes:
                            /api/method/login, /login, /app, /assets, /files, /private,
                            /socket.io'
                          rule: self.all(p, !['/api/method/login', '/login', '/app',
                            '/assets', '/files', '/private', '/socket.io'].exists(r,
                            p == r || p.startsWith(r + '/') || r.startsWith(p + '/')))
                    required:
                    - paths
                    type: object
                type: object
              env:
                description: |-
                  Env adds environment variables to the container. Operator-managed binding
                  keys (FRAPPE_SITE, CENTRAL_SITE_URL, PORT, DB_*) cannot be set here.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-validations:
                - message: 'env must not set operator-managed binding keys: FRAPPE_SITE,
                    CENTRAL_SITE_URL, PORT, DB_*'
                  rule: self.all(e, !(e.name in ['FRAPPE_SITE', 'CENTRAL_SITE_URL',
                    'PORT']) && !e.name.startsWith('DB_'))
              image:
                description: Image of the microservice, typically built on frappe-microservice-lib.
                properties:
                  pullPolicy:
                    description: PullPolicy is the image pull policy
                    enum:
                    - Always
                    - Never
                    - IfNotPresent
                    type: string
                  pullSecrets:
                    description: PullSecrets for private registries
                    items:
                      description: |-
                        LocalObjectReference contains enough information to let you locate the
                        referenced object inside the same namespace.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    type: array
                  repository:
                    description: Repository is the base image repository
                    type: string
                  tag:
                    description: Tag is the image tag
                    type: string
                type: object
                x-kubernetes-validations:
                - message: image.repository is required
                  rule: has(self.repository) && self.repository != ''
              job:
                description: Job run settings. Valid when type is Job or CronJob.
                properties:
                  activeDeadlineSeconds:
                    description: ActiveDeadlineSeconds bounds how long a run may take.
                    format: int64
                    minimum: 1
                    type: integer
                  backoffLimit:
                    description: |-
                      BackoffLimit is the number of retries before a run is marked failed.
                      Kubernetes defaults it to 6.
                    format: int32
                    minimum: 0
                    type: integer
                  ttlSecondsAfterFinished:
                    description: |-
                      TTLSecondsAfterFinished lets Kubernetes delete a finished Job. The
                      operator remembers the run in status and does not start it again.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              resources:
                description: Resources for the microservice container.
                properties:
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: Limits describes the maximum amount of compute resources
                      allowed
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: Requests describes the minimum amount of compute
                      resources required
                    type: object
                type: object
              siteRef:
                description: |-
                  SiteRef is the FrappeSite (in this namespace) the microservice binds to.
                  The operator generates the site binding Secret from it. Immutable.
                properties:
                  name:
                    description: Name of the FrappeSite.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: siteRef is immutable
                  rule: self == oldSelf
              type:
                default: Deployment
                description: Type of workload. Immutable.
                enum:
                - Deployment
                - Job
                - CronJob
                type: string
                x-kubernetes-validations:
                - message: type is immutable
                  rule: self == oldSelf
            required:
            - image
            - siteRef
            type: object
            x-kubernetes-validations:
            - message: targetCPUUtilizationPercentage requires resources.requests.cpu
              rule: '!has(self.deployment) || !has(self.deployment.autoscaling) ||
                !has(self.deployment.autoscaling.targetCPUUtilizationPercentage) ||
                (has(self.resources) && has(self.resources.requests) && ''cpu'' in
                self.resources.requests)'
            - message: targetMemoryUtilizationPercentage requires resources.requests.memory
              rule: '!has(self.deployment) || !has(self.deployment.autoscaling) ||
                !has(self.deployment.autoscaling.targetMemoryUtilizationPercentage)
                || (has(self.resources) && has(self.resources.requests) && ''memory''
                in self.resources.requests)'
            - message: deployment is only valid when type is Deployment
              rule: self.type == 'Deployment' || !has(self.deployment)
            - message: job is only valid when type is Job or CronJob
              rule: self.type != 'Deployment' || !has(self.job)
            - message: cronJob is required when type is CronJob, and only valid then
              rule: (self.type == 'CronJob') == has(self.cronJob)
            - message: command is required when type is Job or CronJob
              rule: self.type == 'Deployment' || (has(self.command) && size(self.command)
                > 0)
          status:
            description: FrappeMicroserviceStatus defines the observed state of FrappeMicroservice.
            properties:
              activeJobs:
                description: ActiveJobs is the number of running Jobs started by the
                  CronJob.
                format: int32
                type: integer
              autoscaling:
                description: |-
                  Autoscaling reports the replica counts while spec.deployment.autoscaling
                  is set (type Deployment).
                properties:
                  currentReplicas:
                    description: CurrentReplicas is the number of pods the Deployment
                      runs now.
                    format: int32
                    type: integer
                  desiredReplicas:
                    description: DesiredReplicas is the count the autoscaler asks
                      for.
                    format: int32
                    type: integer
                required:
                - currentReplicas
                - desiredReplicas
                type: object
              conditions:
                description: |-
                  Conditions: SiteReady always; Available and Routed (Deployment);
                  Complete (Job); Scheduled (CronJob).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              externalURLs:
                description: ExternalURLs lists the routed URLs on the site's domain.
                items:
                  type: string
                type: array
              jobName:
                description: JobName is the Job of the current run (type Job).
                type: string
              lastScheduleTime:
                description: LastScheduleTime of the CronJob (type CronJob).
                format: date-time
                type: string
              lastSuccessfulTime:
                description: LastSuccessfulTime of the CronJob (type CronJob).
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is Ready when SiteReady and Available are True and, if routed,
                  Routed is True.
                enum:
                - Pending
                - Ready
                - Running
                - Succeeded
                - Failed
                type: string
              readyReplicas:
                description: ReadyReplicas reported by the Deployment (type Deployment).
                format: int32
                type: integer
              serviceURL:
                description: ServiceURL is the in-cluster URL of the microservice
                  (type Deployment).
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: a Deployment microservice name must be at most 63 characters (it
            names the Service)
          rule: self.spec.type != 'Deployment' || size(self.metadata.name) <= 63
        - message: a CronJob microservice name must be at most 52 characters
          rule: self.spec.type != 'CronJob' || size(self.metadata.name) <= 52
    served: true
    storage: true
    subresources:
      status: {}
