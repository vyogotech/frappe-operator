apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[{"apiVersion": "vyogo.tech/v1", "kind": "FrappeBench", "metadata":
      {"name": "frappe-bench-advanced", "namespace": "frappe-bench-system"}, "spec":
      {"frappeVersion": "version-15", "apps": [{"name": "frappe", "source": "image"},
      {"name": "erpnext", "source": "image"}], "podConfig": {"labels": {"environment":
      "production", "cost-center": "1234"}, "geoTag": {"region": "us-east-1", "zone":
      "us-east-1a"}, "tolerations": [{"key": "dedicated", "operator": "Equal", "value":
      "frappe", "effect": "NoSchedule"}], "affinity": {"podAntiAffinity": {"preferredDuringSchedulingIgnoredDuringExecution":
      [{"weight": 100, "podAffinityTerm": {"labelSelector": {"matchExpressions": [{"key":
      "app.kubernetes.io/name", "operator": "In", "values": ["frappe-bench"]}]}, "topologyKey":
      "kubernetes.io/hostname"}}]}}}}}, {"apiVersion": "vyogo.tech/v1", "kind": "FrappeSite",
      "metadata": {"labels": {"app.kubernetes.io/name": "frappesite", "app.kubernetes.io/instance":
      "frappesite-sample", "app.kubernetes.io/part-of": "frappe-operator", "app.kubernetes.io/managed-by":
      "kustomize", "app.kubernetes.io/created-by": "frappe-operator"}, "name": "frappesite-sample"},
      "spec": null}, {"apiVersion": "vyogo.tech/v1", "kind": "SiteDashboardChart",
      "metadata": {"labels": {"app.kubernetes.io/name": "sitedashboardchart", "app.kubernetes.io/instance":
      "sitedashboardchart-sample", "app.kubernetes.io/part-of": "frappe-operator",
      "app.kubernetes.io/managed-by": "kustomize", "app.kubernetes.io/created-by":
      "frappe-operator"}, "name": "sitedashboardchart-sample"}, "spec": null}, {"apiVersion":
      "vyogo.tech/v1", "kind": "SiteBackup", "metadata": {"labels": {"app.kubernetes.io/name":
      "sitebackup", "app.kubernetes.io/instance": "sitebackup-sample", "app.kubernetes.io/part-of":
      "frappe-operator", "app.kubernetes.io/managed-by": "kustomize", "app.kubernetes.io/created-by":
      "frappe-operator"}, "name": "sitebackup-sample"}, "spec": null}, {"apiVersion":
      "vyogo.tech/v1", "kind": "SiteUser", "metadata": {"labels": {"app.kubernetes.io/name":
      "siteuser", "app.kubernetes.io/instance": "siteuser-sample", "app.kubernetes.io/part-of":
      "frappe-operator", "app.kubernetes.io/managed-by": "kustomize", "app.kubernetes.io/created-by":
      "frappe-operator"}, "name": "siteuser-sample"}, "spec": null}, {"apiVersion":
      "vyogo.tech/v1", "kind": "FrappeWorkpace", "metadata": {"labels": {"app.kubernetes.io/name":
      "frappeworkpace", "app.kubernetes.io/instance": "frappeworkpace-sample", "app.kubernetes.io/part-of":
      "frappe-operator", "app.kubernetes.io/managed-by": "kustomize", "app.kubernetes.io/created-by":
      "frappe-operator"}, "name": "frappeworkpace-sample"}, "spec": null}, {"apiVersion":
      "vyogo.tech/v1", "kind": "SiteDashboard", "metadata": {"labels": {"app.kubernetes.io/name":
      "sitedashboard", "app.kubernetes.io/instance": "sitedashboard-sample", "app.kubernetes.io/part-of":
      "frappe-operator", "app.kubernetes.io/managed-by": "kustomize", "app.kubernetes.io/created-by":
      "frappe-operator"}, "name": "sitedashboard-sample"}, "spec": null}, {"apiVersion":
      "vyogo.tech/v1", "kind": "SiteJob", "metadata": {"labels": {"app.kubernetes.io/name":
      "sitejob", "app.kubernetes.io/instance": "sitejob-sample", "app.kubernetes.io/part-of":
      "frappe-operator", "app.kubernetes.io/managed-by": "kustomize", "app.kubernetes.io/created-by":
      "frappe-operator"}, "name": "sitejob-sample"}, "spec": null}, {"apiVersion":
      "vyogo.tech/v1", "kind": "SiteWorkspace", "metadata": {"labels": {"app.kubernetes.io/name":
      "siteworkspace", "app.kubernetes.io/instance": "siteworkspace-sample", "app.kubernetes.io/part-of":
      "frappe-operator", "app.kubernetes.io/managed-by": "kustomize", "app.kubernetes.io/created-by":
      "frappe-operator"}, "name": "siteworkspace-sample"}, "spec": null}]'
    capabilities: Basic Install
    categories: Application Runtime,Database
    features.operators.openshift.io/disconnected-compliant: "true"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    olm.openShiftVersions: 4.12-4.18
    olm.targetNamespaces: frappe-operator-system
    operatorframework.io/suggested-namespace: frappe-operator-system
  name: frappe-operator.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: Manages Frappe site API keys and secrets for programmatic access.
      displayName: Site API Key
      kind: SiteAPIKey
      name: siteapikeys.vyogo.tech
      version: v1
    - description: Manages custom client-side JavaScript extensions in Frappe Desk.
      displayName: Site Client Script
      kind: SiteClientScript
      name: siteclientscripts.vyogo.tech
      version: v1
    - description: Manages Frappe site configuration variables and maintenance modes.
      displayName: Site Config
      kind: SiteConfig
      name: siteconfigs.vyogo.tech
      version: v1
    - description: Manages scheduled cron jobs and periodic bench method execution.
      displayName: Site Cron
      kind: SiteCron
      name: sitecrons.vyogo.tech
      version: v1
    - description: Manages Frappe DocType custom fields declaratively.
      displayName: Site Custom Field
      kind: SiteCustomField
      name: sitecustomfields.vyogo.tech
      version: v1
    - description: Manages Frappe DocType property overrides declaratively.
      displayName: Site Property Setter
      kind: SitePropertySetter
      name: sitepropertysetters.vyogo.tech
      version: v1
    - description: Enforces storage, site, and resource quotas across Frappe sites.
      displayName: Site Quota
      kind: SiteQuota
      name: sitequotas.vyogo.tech
      version: v1
    - description: Manages Frappe user roles and permission sets.
      displayName: Site Role
      kind: SiteRole
      name: siteroles.vyogo.tech
      version: v1
    - description: Manages server-side Python scripts executed on DocType events or
        API calls.
      displayName: Site Server Script
      kind: SiteServerScript
      name: siteserverscripts.vyogo.tech
      version: v1
    - description: Manages Frappe user data-level document permissions.
      displayName: Site User Permission
      kind: SiteUserPermission
      name: siteuserpermissions.vyogo.tech
      version: v1
    - description: Manages outgoing webhooks triggered by Frappe DocType events.
      displayName: Site Webhook
      kind: SiteWebhook
      name: sitewebhooks.vyogo.tech
      version: v1
    - description: FrappeBench manages shared infrastructure, web proxies, workers, and FPM repositories for multi-tenant Frappe sites.
      displayName: Frappe Bench
      kind: FrappeBench
      name: frappebenches.vyogo.tech
      version: v1
      specDescriptors:
      - description: Frappe framework version (e.g. version-15)
        displayName: Frappe Version
        path: frappeVersion
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: Applications to install on the bench
        displayName: Apps
        path: apps
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Apps
      - description: Air-gapped FPM (Frappe Package Manager) package repositories
        displayName: FPM Repositories Configuration
        path: fpmConfig
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldGroup:FPM
      - description: List of FPM package repository endpoints
        displayName: FPM Repositories
        path: fpmConfig.repositories
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:fieldGroup:FPM
      - description: Default FPM repository name for package operations
        displayName: Default FPM Repository
        path: fpmConfig.defaultRepo
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: Persistent Volume Claim size for shared bench storage
        displayName: Storage Size
        path: storageSize
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: Custom storage class name for the bench PVC
        displayName: Storage Class Name
        path: storageClassName
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:StorageClass
      - description: Sizing for batch jobs (init, app install, migrations, backups)
        displayName: Job Resources
        path: jobResources
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: In-memory cache and message queue broker configuration
        displayName: Redis / DragonFly Configuration
        path: redisConfig
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      statusDescriptors:
      - description: Whether the shared bench platform infrastructure is fully initialized and ready
        displayName: Bench Ready
        path: ready
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: List of tenant sites hosted on this bench
        displayName: Active Tenant Sites
        path: sites
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
    - description: FrappeSite represents an isolated tenant site with polymorphic database, TLS, and OpenShift Route.
      displayName: Frappe Site
      kind: FrappeSite
      name: frappesites.vyogo.tech
      version: v1
      specDescriptors:
      - description: Reference to the parent FrappeBench hosting this site
        displayName: Bench Reference
        path: benchRef.name
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: Primary site domain name that receives traffic
        displayName: Site Name / Hostname
        path: siteName
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: Applications to install during site creation
        displayName: Installed Apps
        path: apps
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: Database engine provider (PostgreSQL, MariaDB, SQLite, External)
        displayName: Database Provider
        path: dbConfig.provider
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:select:postgres
        - urn:alm:descriptor:com.tectonic.ui:select:mariadb
        - urn:alm:descriptor:com.tectonic.ui:select:sqlite
        - urn:alm:descriptor:com.tectonic.ui:select:external
      - description: PostgreSQL provisioning engine (StackGres or Percona)
        displayName: PostgreSQL Engine
        path: dbConfig.postgresEngine
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:select:stackgres
        - urn:alm:descriptor:com.tectonic.ui:select:percona
      - description: Database deployment mode (Dedicated cluster or Shared database)
        displayName: Database Mode
        path: dbConfig.mode
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:select:dedicated
        - urn:alm:descriptor:com.tectonic.ui:select:shared
      - description: Dedicated database storage volume size
        displayName: Database Storage Size
        path: dbConfig.storageSize
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: Secret reference containing external database credentials
        displayName: Database Secret Reference
        path: dbConfig.connectionSecretRef.name
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes:Secret
      - description: Red Hat OpenShift Route configuration with automated Edge TLS redirection
        displayName: OpenShift Route
        path: routeConfig.enabled
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: Policy for database retention upon site CR deletion (Retain prevents data loss)
        displayName: Database Deletion Policy
        path: deletionPolicy
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:select:Retain
        - urn:alm:descriptor:com.tectonic.ui:select:Delete
      - description: Bypass bench new-site initialization if database schema already exists
        displayName: Skip Initialization
        path: skipInit
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      statusDescriptors:
      - description: Current lifecycle phase of the site (Pending, Provisioning, Ready, Failed)
        displayName: Lifecycle Phase
        path: phase
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.phase
      - description: Direct HTTPS accessible URL of the site
        displayName: Site URL
        path: siteURL
        x-descriptors:
        - urn:alm:descriptor:org.w3:link
      - description: Status of the underlying database instance
        displayName: Database Ready
        path: databaseReady
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: Provisioned database name
        displayName: Database Name
        path: databaseName
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
    - description: FrappeWorkpace is the Schema for the frappeworkpaces API
      displayName: Frappe Workpace
      kind: FrappeWorkpace
      name: frappeworkpaces.vyogo.tech
      version: v1
    - description: SiteApp is the Schema for the siteapps API
      displayName: Site App
      kind: SiteApp
      name: siteapps.vyogo.tech
      version: v1
    - description: SiteBackup is the Schema for the sitebackups API
      displayName: Site Backup
      kind: SiteBackup
      name: sitebackups.vyogo.tech
      version: v1
    - description: SiteDashboardChart is the Schema for the sitedashboardcharts API
      displayName: Site Dashboard Chart
      kind: SiteDashboardChart
      name: sitedashboardcharts.vyogo.tech
      version: v1
    - description: SiteDashboard is the Schema for the sitedashboards API
      displayName: Site Dashboard
      kind: SiteDashboard
      name: sitedashboards.vyogo.tech
      version: v1
    - description: SiteDomain is the Schema for the sitedomains API
      displayName: Site Domain
      kind: SiteDomain
      name: sitedomains.vyogo.tech
      version: v1
    - description: SiteJob is the Schema for the sitejobs API
      displayName: Site Job
      kind: SiteJob
      name: sitejobs.vyogo.tech
      version: v1
    - description: SiteMigration is the Schema for the sitemigrations API
      displayName: Site Migration
      kind: SiteMigration
      name: sitemigrations.vyogo.tech
      version: v1
    - description: SiteRestore is the Schema for the siterestores API
      displayName: Site Restore
      kind: SiteRestore
      name: siterestores.vyogo.tech
      version: v1
    - description: SiteUser is the Schema for the siteusers API
      displayName: Site User
      kind: SiteUser
      name: siteusers.vyogo.tech
      version: v1
    - description: SiteWorkspace is the Schema for the siteworkspaces API
      displayName: Site Workspace
      kind: SiteWorkspace
      name: siteworkspaces.vyogo.tech
      version: v1
  description: |
    The Frappe Operator brings the robust capabilities of Frappe and ERPNext frameworks natively into Kubernetes using the Operator Pattern.

    ### Features
    * **FrappeBench Provisioning**: Automatically deploy and scale custom Frappe stacks natively.
    * **Database Harmonization**: Spin up shared or dedicated MariaDB instances tailored.
    * **Automated Replicas**: High Availability web worker routing via Ingress.
    * **GitOps Compliance**: Designed to operate smoothly with ArgoCD.

    ### Setup
    Ensure that you have deployed the prerequisites in your cluster before bootstrapping an ERPNext portal using standard `kubectl apply` commands.
  displayName: Frappe Operator
  icon:
  - base64data: 
    mediatype: image/png
  install:
    spec:
      deployments: null
    strategy: ""
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - frappe
  - erpnext
  - operator
  links:
  - name: Frappe Operator
    url: https://github.com/vyogotech/frappe-operator
  maintainers:
  - email: rakesh@vyogo.tech
    name: rakeshkumarmallam
  - email: info@vyogo.tech
    name: varkrish
  maturity: alpha
  minKubeVersion: 1.23.0
  provider:
    name: Vyogo Tech
    url: https://vyogo.tech
  relatedImages:
  - image: ghcr.io/vyogotech/frappe-operator:v5.2.0
    name: frappe-operator
  - image: frappe/erpnext:version-15
    name: frappe-bench-v15
  - image: frappe/erpnext:version-14
    name: frappe-bench-v14
  - image: mariadb:10.6
    name: mariadb
  - image: redis:7.0-alpine
    name: redis
  - image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    name: utility-ubi
  version: 0.0.0
