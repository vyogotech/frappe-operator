  description: 'The Frappe Operator brings the robust capabilities of Frappe and ERPNext
    frameworks natively into Kubernetes using the Operator Pattern.


    ### Features

    * **FrappeBench Provisioning**: Automatically deploy and scale custom Frappe stacks
    natively.

    * **Database Harmonization**: Spin up shared or dedicated MariaDB instances tailored.

    * **Automated Replicas**: High Availability web worker routing via Ingress.

    * **GitOps Compliance**: Designed to operate smoothly with ArgoCD.


    ### Setup

    Ensure that you have deployed the prerequisites in your cluster before bootstrapping
    an ERPNext portal using standard `kubectl apply` commands.

    '
