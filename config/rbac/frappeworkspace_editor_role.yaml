# permissions for end users to edit frappeworkspaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: frappeworkspace-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: frappe-operator
    app.kubernetes.io/part-of: frappe-operator
    app.kubernetes.io/managed-by: kustomize
  name: frappeworkspace-editor-role
rules:
- apiGroups:
  - vyogo.tech
  resources:
  - frappeworkspaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - vyogo.tech
  resources:
  - frappeworkspaces/status
  verbs:
  - get
