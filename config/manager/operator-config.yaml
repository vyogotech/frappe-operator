apiVersion: v1
kind: ConfigMap
metadata:
  name: frappe-operator-config
data:
  # Default domain suffix for auto-detected sites
  # Override per-bench or per-site as needed
  defaultDomainSuffix: ".myplatform.com"
  
  # Ingress controller service to detect domain from
  ingressControllerService: "ingress-nginx-controller"
  ingressControllerNamespace: "ingress-nginx"
  
  # Git configuration
  # Set to "false" to disable Git-based app installation (enterprise mode)
  # Individual benches can override this setting
  gitEnabled: "false"
  
  # FPM CLI path in container
  fpmCliPath: "/usr/local/bin/fpm"
  
  # FPM default repositories (JSON array)
  # These repositories are available to all benches
  # Benches can add additional repositories in their spec
  fpmRepositories: |
    [
      {
        "name": "frappe-community",
        "url": "https://fpm.frappe.io",
        "priority": 100
      }
    ]
  
  # Max concurrent FrappeSite reconciles (default 10). Tune for 100s of sites.
  # Can be overridden per-bench via spec.siteReconcileConcurrency (operator uses max).
  maxConcurrentSiteReconciles: "10"

  # Max concurrent reconciles for the FrappeBench controller and all site-child
  # resource controllers (SiteApp, SiteConfig, ...). Default 5; raise for 500+ sites.
  maxConcurrentReconciles: "5"
  
  # Default image configuration
  # These defaults are used when not specified in bench.spec.imageConfig
  # Individual benches can override these in their spec.imageConfig
  defaultFrappeImage: "ghcr.io/vyogotech/erpnext-for-operator:version-16"
  defaultMariaDBImage: "docker.io/library/mariadb:10.6"
  defaultPostgresImage: "docker.io/library/postgres:15-alpine"
  defaultRedisImage: "docker.io/library/redis:7-alpine"
  defaultNginxImage: "docker.io/library/nginx:1.25-alpine"

  # HTTPS policy. Default "false" preserves per-site opt-in TLS (spec.tls.enabled).
  # Set to "true" to make every site's Ingress HTTPS-only regardless of its own
  # spec.tls.enabled or ingress annotations (OpenShift Routes are unaffected;
  # they are already HTTPS-only via edge termination). On non-OpenShift clusters,
  # enforcing this requires cert-manager (see defaultClusterIssuer below) or a
  # pre-created <site>-tls secret per site, and is incompatible with proxies that
  # speak plain HTTP to the origin (e.g. Cloudflare in Flexible SSL mode - use
  # Full or Full (strict) instead).
  enforceHTTPS: "false"

  # cert-manager ClusterIssuer used for a site's TLS certificate when the site
  # does not set spec.tls.issuer. Only relevant when TLS is in effect (either
  # spec.tls.enabled or enforceHTTPS above). Leave empty to require every site
  # to set its own issuer or pre-create its TLS secret.
  defaultClusterIssuer: ""

