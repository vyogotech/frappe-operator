# Routed microservice: the same Deployment and Service, plus an Ingress on the
# site's domain (one Route per path on OpenShift). /orders and everything
# below it goes to this service; the rest of the domain stays on the monolith.
apiVersion: vyogo.tech/v1
kind: FrappeMicroservice
metadata:
  name: orders
  labels:
    app.kubernetes.io/name: frappemicroservice
    app.kubernetes.io/instance: orders
    app.kubernetes.io/part-of: frappe-operator
spec:
  siteRef:
    name: frappesite-sample
  image:
    repository: ghcr.io/myorg/orders-service
    tag: "1.0.0"
    pullSecrets:
      - name: regcred
  port: 8000
  replicas: 2
  routing:
    paths:
      - /orders
      - /api/v1/orders
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  env:
    - name: LOG_LEVEL
      value: INFO
