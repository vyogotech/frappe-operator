apiVersion: vyogo.tech/v1
kind: FrappeBench
metadata:
  name: e2e-test-bench
  namespace: default
spec:
  frappeVersion: "version-15"
  imageConfig:
    repository: ghcr.io/vyogotech/erpnext-for-operator
    tag: version-15
  apps:
    - name: erpnext
      source: image
  redisConfig:
    type: redis
  componentAutoscaling:
    worker-short:
      enabled: false
    worker-long:
      enabled: false
    worker-default:
      enabled: false
      staticReplicas: 1
---
apiVersion: vyogo.tech/v1
kind: FrappeSite
metadata:
  name: e2e-test-site
  namespace: default
spec:
  benchRef:
    name: e2e-test-bench
  siteName: e2e.localhost
  adminPasswordSecretRef:
    name: e2e-admin-password
  dbConfig:
    provider: mariadb
  ingress:
    enabled: true
