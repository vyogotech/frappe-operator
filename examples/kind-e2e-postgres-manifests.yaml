apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: e2e-postgres
  namespace: frappe
spec:
  instances:
    - name: instance1
      replicas: 1
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  proxy:
    pgBouncer:
      replicas: 1
---
apiVersion: v1
kind: Secret
metadata:
  name: e2e-postgres-provisioner
  namespace: frappe
stringData:
  user: postgres
  password: e2e_secure_password
---
apiVersion: vyogo.tech/v1alpha1
kind: FrappeBench
metadata:
  name: e2e-postgres-bench
  namespace: frappe
spec:
  framework:
    version: version-15
  dbConfig:
    provider: postgres
    mode: shared
    postgresRef:
      name: e2e-postgres
---
apiVersion: vyogo.tech/v1alpha1
kind: FrappeSite
metadata:
  name: e2e-postgres-site
  namespace: frappe
spec:
  siteName: pg-e2e.apps-crc.testing
  benchRef:
    name: e2e-postgres-bench
