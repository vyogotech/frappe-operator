# Frappe Bench with Worker Autoscaling
# This example shows how to configure KEDA-based autoscaling for background workers

apiVersion: vyogo.tech/v1alpha1
kind: FrappeBench
metadata:
  name: autoscaling-bench
  namespace: default
spec:
  frappeVersion: "version-15"
  
  # Apps to install
  apps:
    - name: erpnext
      source: image  # Use pre-built image (fastest)
  
  # Redis configuration for queue management
  redisConfig:
    type: redis
  
  # Component autoscaling configuration
  componentAutoscaling:
    # Short queue workers - KEDA based scaling to zero
    worker-short:
      enabled: true
      provider: keda
      minReplicas: 0
      maxReplicas: 10
      pollingInterval: 10
      cooldownPeriod: 30
      keda:
        trigger: redis
        targetValue: "2"
    
    # Long queue workers - KEDA based scaling
    worker-long:
      enabled: true
      provider: keda
      minReplicas: 1
      maxReplicas: 5
      pollingInterval: 30
      cooldownPeriod: 60
      keda:
        trigger: redis
        targetValue: "5"
    
    # NGINX - HPA based scaling
    nginx:
      enabled: true
      provider: hpa
      minReplicas: 2
      maxReplicas: 10
      hpa:
        metric: cpu
        targetUtilization: 70
    
    # Gunicorn - static replicas
    gunicorn:
      enabled: false
      staticReplicas: 2

---
# Example FrappeSite using the autoscaling bench
apiVersion: vyogo.tech/v1alpha1
kind: FrappeSite
metadata:
  name: autoscaling-site
  namespace: default
spec:
  benchRef:
    name: autoscaling-bench
    namespace: default
  siteName: autoscaling.local
  adminPasswordSecretRef:
    name: autoscaling-site-admin-password
  dbConfig:
    provider: mariadb
    mode: shared
    mariadbRef:
      name: frappe-mariadb
      namespace: frappe-operator-system
