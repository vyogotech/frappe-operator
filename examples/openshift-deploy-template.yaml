apiVersion: vyogo.tech/v1
kind: FrappeBench
metadata:
  name: ${BENCH_NAME}
  namespace: ${NAMESPACE}
spec:
  frappeVersion: "${FRAPPE_VERSION}"
  imageConfig:
    repository: "${IMAGE_REPOSITORY}"
    tag: "${IMAGE_TAG}"
  apps:
    - name: erpnext
      source: image
  redisConfig:
    type: redis
  componentAutoscaling:
    workerShort:
      enabled: false
    workerLong:
      enabled: false
    workerDefault:
      enabled: false
      staticReplicas: 1
---
apiVersion: vyogo.tech/v1
kind: FrappeSite
metadata:
  name: ${SITE_NAME}
  namespace: ${NAMESPACE}
spec:
  benchRef: ${BENCH_NAME}
  siteName: ${DOMAIN}
  adminPasswordSecretRef:
    name: ${SITE_NAME}-admin-password
  dbConfig:
    provider: mariadb
  routeConfig:
    enabled: true
    termination: edge
