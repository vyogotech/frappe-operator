# Example: Frappe site using shared MariaDB instance
# This is the most cost-effective option for multiple sites

apiVersion: vyogo.tech/v1
kind: FrappeBench
metadata:
  name: shared-bench
  namespace: default
spec:
  frappeVersion: "version-15"
  apps:
    - name: erpnext
      source: image
  
  componentAutoscaling:
    gunicorn:
      enabled: false
      staticReplicas: 2
    scheduler:
      enabled: false
      staticReplicas: 1
    worker-default:
      enabled: false
      staticReplicas: 2
    worker-short:
      enabled: false
      staticReplicas: 1
    worker-long:
      enabled: false
      staticReplicas: 1
  storageSize: "10Gi"
---
apiVersion: vyogo.tech/v1
kind: FrappeSite
metadata:
  name: site1
  namespace: default
spec:
  benchRef:
    name: shared-bench
  
  siteName: site1.example.com
  adminPasswordSecretRef:
    name: site1-admin-password
  
  # Database configuration - shared mode
  dbConfig:
    provider: mariadb
    mode: shared
    mariadbRef:
      name: frappe-mariadb  # References the shared MariaDB instance
      namespace: default
  
  # Ingress configuration
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  
  # TLS configuration
  tls:
    enabled: true
    issuer: letsencrypt-prod

  # Admin password will be auto-generated and stored in:
  # Secret: site1-admin (key: password)
  
  # Database credentials will be auto-generated by MariaDB Operator:
  # - Database: _<hash>_site1_example_com
  # - User: site1_user
  # - Password Secret: site1-db-password


