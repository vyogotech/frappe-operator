apiVersion: k8s.mariadb.com/v1
kind: MariaDB
metadata:
  name: frappe-mariadb
  namespace: frappe
spec:
  rootPasswordSecretKeyRef:
    name: mariadb-root-password
    key: password
  image: mariadb:10.11
  storage:
    size: 2Gi
  replicas: 1
---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-root-password
  namespace: frappe
type: Opaque
stringData:
  password: frappe
---
apiVersion: v1
kind: Secret
metadata:
  name: e2e-admin-password
  namespace: frappe
type: Opaque
stringData:
  password: admin
---
apiVersion: vyogo.tech/v1
kind: FrappeBench
metadata:
  name: e2e-test-bench
  namespace: frappe
spec:
  frappeVersion: "version-15"
  # rmallam image (includes frappe + erpnext; amd64)
  imageConfig:
    repository: ghcr.io/rmallam/frappe_docker
    tag: sha-3db38eb
    pullPolicy: IfNotPresent
  apps:
    - name: erpnext
      source: image
  redisConfig:
    type: redis
  componentAutoscaling:
    worker-default:
      enabled: false
      staticReplicas: 1
    worker-short:
      enabled: false
      staticReplicas: 0
    worker-long:
      enabled: false
      staticReplicas: 0
  # E2E: custom labels so "Verify Advanced Pod Configuration" can check propagation (operator applies podConfig at create time)
  podConfig:
    labels:
      e2e-custom-label: verified
---
apiVersion: vyogo.tech/v1
kind: FrappeSite
metadata:
  name: e2e-test-site
  namespace: frappe
spec:
  benchRef:
    name: e2e-test-bench
  siteName: e2e.apps-crc.testing   
  # Install ERPNext on the site (bench already has erpnext app from image)
  apps:
    - erpnext
  adminPasswordSecretRef:
    name: e2e-admin-password
  # Database configuration
  dbConfig:
    provider: mariadb
    mode: shared
    mariadbRef:
      name: frappe-mariadb
      namespace: frappe
  ingress:
    enabled: true
    # Note: 'domain' is a top-level field in spec, not under ingress.
    # It defaults to siteName if not specified.
