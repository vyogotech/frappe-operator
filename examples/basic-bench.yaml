# Basic Frappe Bench for development/testing

apiVersion: vyogo.tech/v1
kind: FrappeBench
metadata:
  name: dev-bench
  namespace: default
spec:
  frappeVersion: "15"
  imageConfig:
    repository: ghcr.io/vyogotech/frappe_base
    tag: latest
    pullPolicy: Always
  # Apps to install
  apps:
    - name: erpnext
      source: image  # Use pre-built image (fastest)
  
  # Component autoscaling and replicas (minimal for development)
  componentAutoscaling:
    gunicorn:
      enabled: false
      staticReplicas: 1
    scheduler:
      enabled: false
      staticReplicas: 1
    worker-default:
      enabled: false
      staticReplicas: 1
    worker-short:
      enabled: false
      staticReplicas: 1
    worker-long:
      enabled: false
      staticReplicas: 1
  
  # Storage size
  storageSize: "5Gi"
  
  # Optional: Specify storage class
  # storageClassName: standard
  
  # Security context is automatically set to OpenShift-compatible defaults:
  # runAsUser: 1001, runAsGroup: 0, fsGroup: 0
  # Override only if your container uses different UID/GID:
  # security:
  #   podSecurityContext:
  #     runAsUser: 1001
  #     runAsGroup: 0
  #     fsGroup: 0


