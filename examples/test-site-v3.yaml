apiVersion: v1
kind: Secret
metadata:
  name: test-site-v3-admin-password
  namespace: frappe-test
type: Opaque
stringData:
  password: "admin123"
---
apiVersion: vyogo.tech/v1
kind: FrappeSite
metadata:
  name: test-site-v3
  namespace: frappe-test
spec:
  siteName: "test-v3.local"
  benchRef:
    name: test-bench
    namespace: frappe-test
  adminPasswordSecretRef:
    name: test-site-v3-admin-password
    namespace: frappe-test
  dbConfig:
    provider: mariadb
    mode: dedicated
    storageSize: 1Gi
  ingress:
    enabled: true
    className: nginx
