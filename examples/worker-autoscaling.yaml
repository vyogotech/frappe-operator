# Example: FrappeBench with KEDA-based Worker Autoscaling
# Demonstrates queue-based scaling with scale-to-zero support

apiVersion: vyogo.tech/v1alpha1
kind: FrappeBench
metadata:
  name: worker-autoscale-bench
  namespace: frappe
spec:
  frappeVersion: "version-15"
  
  apps:
    - name: erpnext
      source: image

  componentAutoscaling:
    # Short Workers: High concurrency, scale to zero when idle
    worker-short:
      enabled: true
      provider: keda
      minReplicas: 0        
      maxReplicas: 20
      pollingInterval: 10
      cooldownPeriod: 30
      keda:
        trigger: redis
        targetValue: "3"    # Scale up when queue length > 3

    # Long Workers: Low concurrency, maintain 1
    worker-long:
      enabled: true
      provider: keda
      minReplicas: 1        
      maxReplicas: 5
      keda:
        trigger: redis
        targetValue: "1"    # Scale up when queue length > 1

    # Default Workers: Static
    worker-default:
      enabled: false
      staticReplicas: 2

    # Gunicorn/Nginx: Static (no autoscaling)
    gunicorn:
      enabled: false
      staticReplicas: 2
    nginx:
      enabled: false
      staticReplicas: 1

  # Resource limits
  componentResources:
    worker-short:
      requests: {cpu: "100m", memory: "256Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
    worker-long:
      requests: {cpu: "500m", memory: "1Gi"}
      limits: {cpu: "1000m", memory: "2Gi"}
