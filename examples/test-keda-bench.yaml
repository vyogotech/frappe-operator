# Simple FrappeBench with KEDA autoscaling for E2E testing
# Generated from configuration: /home/varun/projects/frappe-operator/test-config.conf
apiVersion: vyogo.tech/v1
kind: FrappeBench
metadata:
  name: test-bench-keda
  namespace: default
spec:
  frappeVersion: "15"
  
  # Use custom Frappe image
  imageConfig:
    repository: ghcr.io/rmallam/frappe_docker
    tag: sha-ae82c47
  
  apps:
    - name: erpnext
      source: image
  
  componentAutoscaling:
    nginx:
      enabled: true
      provider: keda
      minReplicas: 1
      maxReplicas: 3
      pollingInterval: 15
      cooldownPeriod: 30
      keda:
        trigger: cpu
        targetValue: "50"
