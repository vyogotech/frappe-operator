apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sre-bot-system

resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - openclaw-configmap.yaml

# This auto-generates a ConfigMap containing all our markdown skills.
# The OpenClaw Deployment mounts this ConfigMap into /app/skills/
configMapGenerator:
  - name: sre-skills-config
    files:
      - skills/CrashLoopBackOff.md
      - skills/OOMKilled.md
