apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-bot
  namespace: sre-bot-system
  labels:
    app: openclaw-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-bot
  template:
    metadata:
      labels:
        app: openclaw-bot
    spec:
      serviceAccountName: sre-bot
      containers:
        - name: openclaw
          image: openclaw-bot:v0.1.1
          imagePullPolicy: IfNotPresent
          command: ["openclaw"]
          args:
            - "gateway"
            - "--bind"
            - "lan"
            - "--allow-unconfigured"
            - "--port"
            - "18789"
          env:
            - name: HOME
              value: "/home/claw"
            - name: TERM
              value: "xterm-256color"
            - name: TZ
              value: "Asia/Kolkata"
            - name: OPENCLAW_GATEWAY_TOKEN
              value: "atxinvox-admin"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: api_key
                  optional: true
          volumeMounts:
            - name: skills-volume
              mountPath: /app/skills
              readOnly: true
            - name: openclaw-config
              mountPath: /home/claw/.openclaw
            - name: config-json
              mountPath: /home/claw/.openclaw/openclaw.json
              subPath: openclaw.json
              readOnly: true
          ports:
            - containerPort: 18789
              name: dashboard
      volumes:
        - name: skills-volume
          configMap:
            name: sre-skills-config
        - name: openclaw-config
          emptyDir: {}
        - name: config-json
          configMap:
            name: openclaw-config
            items:
              - key: openclaw.json
                path: openclaw.json
