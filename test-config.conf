# Configuration file for Frappe Operator Autoscaling Tests
# This file contains all configurable values that were previously hardcoded

# Cluster Configuration
DEFAULT_CLUSTER_NAME="frappe-autoscaling-helm"
DEFAULT_NAMESPACE="default"

# Container Images
OPERATOR_IMAGE_REPOSITORY="ghcr.io/rmallam/frappe-operator"
OPERATOR_IMAGE_TAG="local-test"
FRAPPE_IMAGE_REPOSITORY="ghcr.io/rmallam/frappe_docker"
FRAPPE_IMAGE_TAG="sha-ae82c47"

# Helm Chart Configuration
HELM_TIMEOUT="10m"
OPERATOR_TIMEOUT="180s"
CLUSTER_CREATE_TIMEOUT="5m"
NODE_READY_TIMEOUT="120s"

# Test Configuration
BENCH_READY_TIMEOUT=90
BENCH_READY_SLEEP=10
PROVIDER_SWITCH_TIMEOUT=30
PROVIDER_SWITCH_SLEEP=2
PROVIDER_SWITCH_WAIT=10

# Test Bench Names
KEDA_BENCH_NAME="test-bench-keda"
HPA_BENCH_NAME="test-bench-hpa"

# Autoscaling Defaults
DEFAULT_MIN_REPLICAS=1
DEFAULT_MAX_REPLICAS=3
DEFAULT_HPA_TARGET_UTILIZATION=50
DEFAULT_KEDA_TARGET_VALUE="50"
DEFAULT_KEDA_POLLING_INTERVAL=15
DEFAULT_KEDA_COOLDOWN_PERIOD=30

# Frappe Configuration
DEFAULT_FRAPPE_VERSION="15"

# Component Names
NGINX_COMPONENT="nginx"

# Helm Repository URLs
MARIADB_OPERATOR_REPO="https://mariadb-operator.github.io/mariadb-operator"
KEDA_CORE_REPO="https://kedacore.github.io/charts"

# Kind Configuration
KIND_CONFIG_FILE="kind-config.yaml"

# Temporary Files
TEMP_IMAGE_ARCHIVE="/tmp/frappe-operator-helm.tar"