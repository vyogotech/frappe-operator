{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "frappe-operator.fullname" . }}-manager-role
  labels:
    {{- include "frappe-operator.labels" . | nindent 4 }}
rules:
# Frappe/Site CRDs — grant the ENTIRE vyogo.tech API group. This operator is the
# controller for every vyogo.tech kind (and their /status + /finalizers
# subresources), so "*" is correct and, crucially, drift-proof: the previous
# hand-listed set went stale as new CRDs/controllers were added (sitedomains,
# sitecrons, siteuserpermissions, ...) and the manager crash-looped being unable
# to list them at cluster scope.
- apiGroups:
  - vyogo.tech
  resources:
  - "*"
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

# Core Kubernetes resources
- apiGroups:
  - ""
  resources:
  - configmaps
  - events
  - limitranges
  - persistentvolumeclaims
  - pods
  - resourcequotas
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - ingressclasses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch

# OpenShift Routes
- apiGroups:
  - route.openshift.io
  resources:
  - routes
  - routes/custom-host
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

# Leader Election (cluster-wide)
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

# MariaDB Operator CRDs
- apiGroups:
  - k8s.mariadb.com
  resources:
  - mariadbs
  - databases
  - users
  - grants
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - k8s.mariadb.com
  resources:
  - mariadbs/status
  - databases/status
  - users/status
  - grants/status
  verbs:
  - get

# KEDA ScaledObjects for worker autoscaling
- apiGroups:
  - keda.sh
  resources:
  - scaledobjects
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - keda.sh
  resources:
  - scaledobjects/finalizers
  verbs:
  - update
- apiGroups:
  - keda.sh
  resources:
  - scaledobjects/status
  verbs:
  - get
  - patch
  - update
# Autoscaling (HPA)
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- end }}

