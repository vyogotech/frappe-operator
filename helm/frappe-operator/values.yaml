# Default values for frappe-operator
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Operator configuration
operator:
  # Number of operator replicas
  replicaCount: 1
  
  image:
    repository: ghcr.io/vyogotech/frappe-operator
    pullPolicy: IfNotPresent
    tag: "v5.0.0"
  
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  
  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Node selector
  nodeSelector: {}
  
  # Tolerations
  tolerations: []
  
  # Affinity rules
  affinity: {}
  
  # Security context
  # For OpenShift compatibility, runAsUser and fsGroup are not set by default
  # OpenShift will assign appropriate values via SCC
  securityContext:
    runAsNonRoot: true
    # runAsUser: 65532  # Uncomment for non-OpenShift clusters if needed
    # fsGroup: 65532    # Uncomment for non-OpenShift clusters if needed
  
  # Pod annotations
  podAnnotations: {}
  
  # Service account
  serviceAccount:
    create: true
    annotations: {}
    name: ""

# Operator manager configuration
manager:
  # Metrics configuration
  metrics:
    enabled: true
    port: 8080
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
  
  # Health probe configuration
  health:
    port: 8081
  
  # Leader election
  leaderElection:
    enabled: true
  
  # Log level (debug, info, warn, error)
  logLevel: info

# Webhook configuration
webhook:
  enabled: false
  port: 9443
  certManager:
    enabled: false

# RBAC configuration
rbac:
  create: true

# MariaDB Operator dependency
mariadb-operator:
  enabled: true
  crds:
    enabled: true
  # MariaDB Operator will be installed as a subchart
  # See: https://github.com/mariadb-operator/mariadb-operator
  
  # Override MariaDB Operator values if needed
  # webhook:
  #   enabled: false

# KEDA (Kubernetes Event Driven Autoscaler) dependency
# Default: enabled: true — for standalone installs (kind, dev clusters, novice users)
#          where no cluster-level KEDA is present.
#
# Managed clusters (e.g. production): set keda.enabled: false via your values override
# or Helm --set so that KEDA is not duplicated alongside a cluster-managed installation.
# Duplicate KEDA installations conflict over cluster-scoped CRDs and ClusterRoles,
# causing RBAC errors and informer sync timeouts in both operators.
#
# Controlled by Chart.yaml condition: keda.enabled — setting false skips the subchart entirely.
keda:
  enabled: true
  crds:
    install: true
  # KEDA will be installed as a subchart for worker autoscaling
  # See: https://keda.sh/

# Operator runtime configuration
operatorConfig:
  # Default domain suffix for auto-detected sites
  # Override per-bench or per-site as needed
  defaultDomainSuffix: ".myplatform.com"
  
  # Ingress controller service to detect domain from
  ingressControllerService: "ingress-nginx-controller"
  ingressControllerNamespace: "ingress-nginx"
  
  # Git configuration
  # Set to "false" to disable Git-based app installation (enterprise mode)
  # Individual benches can override this setting
  gitEnabled: "false"
  
  # FPM CLI path in container
  fpmCliPath: "/usr/local/bin/fpm"
  
  # FPM default repositories (JSON array)
  # These repositories are available to all benches
  # Benches can add additional repositories in their spec
  fpmRepositories: |
    [
      {
        "name": "frappe-community",
        "url": "https://fpm.frappe.io",
        "priority": 100
      }
    ]
  
  # Default image configuration
  # These defaults are used when not specified in bench.spec.imageConfig
  # Individual benches can override these in their spec.imageConfig
  defaultFrappeImage: "ghcr.io/vyogotech/erpnext-for-operator:version-16"
  defaultMariaDBImage: "docker.io/library/mariadb:10.6"
  defaultPostgresImage: "docker.io/library/postgres:15-alpine"
  defaultRedisImage: "docker.io/library/redis:7-alpine"
  defaultNginxImage: "docker.io/library/nginx:1.25-alpine"
  
  # Max concurrent FrappeSite reconciles (default 10). Tune for 100s of sites.
  # Can be overridden per-bench via spec.siteReconcileConcurrency (operator uses max).
  maxConcurrentSiteReconciles: "10"

  # Max concurrent reconciles for the FrappeBench controller and every site-child
  # resource controller (SiteApp, SiteConfig, SiteUser, SiteBackup, ...). Default 5.
  # Without this these controllers run at 1 and serialize batch operations across a
  # large fleet; raise for 500+ sites. FrappeSite uses maxConcurrentSiteReconciles above.
  maxConcurrentReconciles: "5"

  # Optional API client throughput for the operator. Higher reconcile concurrency is
  # only useful if the shared kube client rate limiter can keep up during mass
  # provisioning. Leave empty to keep controller-runtime defaults (QPS 20 / Burst 30).
  clientQps: ""
  clientBurst: ""

  # Override KEDA values if needed
  # resources:
  #   operator:
  #     limits:
  #       cpu: 1
  #       memory: 1000Mi
  #     requests:
  #       cpu: 100m
  #       memory: 100Mi

# PostgreSQL support (dbConfig.provider: postgres).
# Dedicated mode provisions a per-site PerconaPGCluster via the Percona
# PostgreSQL Operator (install it separately, e.g. bundle.yaml v2.3.1).
# Leave the image overrides empty to use the operator's built-in defaults
# (Percona PostgreSQL Operator v2.3.1 / PostgreSQL 16); set them to pin or
# mirror images in air-gapped environments.
postgres:
  percona:
    postgresImage: ""
    pgBouncerImage: ""
    pgBackRestImage: ""

# Default MariaDB instance for Frappe sites
mariadb:
  # Enable creation of a default shared MariaDB instance
  enabled: false
  
  # MariaDB instance name
  name: frappe-mariadb
  
  # MariaDB version
  image:
    repository: mariadb
    tag: "10.6"
    pullPolicy: IfNotPresent
  
  # Root password - CHANGE THIS IN PRODUCTION!
  rootPasswordSecretRef:
    name: mariadb-root-password
    key: password
    # If generate is true, a secret will be auto-created
    generate: true
  
  # Storage configuration
  storage:
    size: 50Gi
    storageClassName: ""  # Use default storage class
  
  # Resource limits (reduced for development/minikube compatibility)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # High availability configuration
  replicas: 1
  
  # Galera cluster (for HA)
  galera:
    enabled: false
  
  # Backup configuration
  backup:
    enabled: false
  
  # Additional MariaDB configuration (optimized for resource-constrained environments)
  config: |
    [mysqld]
    character-set-client-handshake=0
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    max_connections=200
    max_allowed_packet=64M
    innodb_buffer_pool_size=256M
    innodb_log_file_size=64M
    innodb_flush_log_at_trx_commit=2
    innodb_flush_method=O_DIRECT

# Ingress controller configuration (optional)
ingress-nginx:
  enabled: false
  # If you want to install NGINX Ingress Controller with the operator
  # Set to true and configure as needed

# cert-manager configuration (optional)
cert-manager:
  enabled: false
  # If you want to install cert-manager with the operator
  # Set to true for automatic TLS certificate management

# Default FrappeBench example (optional)
examples:
  # Create a sample FrappeBench after installation
  createBench: false
  bench:
    name: example-bench
    namespace: default
    frappeVersion: "version-15"
    apps:
      - name: erpnext
        source: image
  
  # Create a sample FrappeSite after installation
  createSite: false
  site:
    name: example-site
    namespace: default
    benchRef: example-bench
    siteName: example.local
    domain: example.local
    ingress:
      enabled: false

# Global configuration
global:
  # Image pull secrets for all components
  imagePullSecrets: []
  
  # Default storage class
  storageClass: ""
  
  # Namespace for operator
  operatorNamespace: frappe-operator-system
  
  # Monitoring and observability
  monitoring:
    enabled: false
    prometheus:
      enabled: false
    grafana:
      enabled: false

