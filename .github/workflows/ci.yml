name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - release
      - feature/**
      - fix/**
      - fix-*
    paths-ignore:
      - "*.md"
      - "_config.yml"
      - "docs/**"
  pull_request:
    branches: [main, master, develop, release, feature/**, fix/**, fix-*]
    paths-ignore:
      - "*.md"
      - "_config.yml"
      - "docs/**"
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Install golangci-lint and gotestsum
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          go install gotest.tools/gotestsum@latest

      - name: Lint codebase (Machine Readable)
        run: |
          echo "=== Linting Codebase ==="
          $(go env GOPATH)/bin/golangci-lint cache clean
          $(go env GOPATH)/bin/golangci-lint run --out-format json > lint-report.json || true
          # Print standard output for humans too
          $(go env GOPATH)/bin/golangci-lint run

      - name: Run unit tests (Machine Readable)
        run: |
          gotestsum --format standard-verbose --jsonfile test-report.json -- -coverprofile=cover.out ./api/... ./pkg/... ./controllers/...

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./cover.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short

      - name: Build local Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: frappe-operator:local-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'frappe-operator:local-scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
