name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/**
    paths-ignore:
      - "*.md"
      - "_config.yml"
      - "docs/**"
  pull_request:
    branches: [main, master, develop, feature/**]
    paths-ignore:
      - "*.md"
      - "_config.yml"
      - "docs/**"
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: |
          go test ./api/... ./pkg/... ./controllers/... -v -coverprofile cover.out

      - name: Run autoscaling-specific unit tests
        run: |
          echo "=== Running Autoscaling Unit Tests ==="
          echo "Testing component autoscaling types..."
          go test -v -run TestComponentAutoscaling ./controllers/ -coverprofile=autoscaling-cover.out

          echo "Testing scaling provider interface..."
          go test -v -run TestScalingProvider ./controllers/

          echo "Testing KEDA provider..."
          go test -v -run TestKEDAProvider ./controllers/

          echo "Testing HPA provider..."
          go test -v -run TestHPAProvider ./controllers/

          echo "Testing component autoscaling helpers..."
          go test -v -run "TestGetComponentAutoscaling|TestFillComponentDefaults|TestGetComponentReplicaCount" ./controllers/

      - name: Lint autoscaling code
        run: |
          echo "=== Linting Autoscaling Code ==="
          go vet ./controllers/scaling_provider.go ./controllers/keda_provider.go ./controllers/hpa_provider.go ./controllers/component_autoscaling_helpers.go ./api/v1alpha1/shared_types.go

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./cover.out,./autoscaling-cover.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
