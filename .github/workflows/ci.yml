name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - release
      - feature/**
      - fix/**
      - fix-*
    paths-ignore:
      - "*.md"
      - "_config.yml"
      - "docs/**"
  pull_request:
    branches: [main, master, develop, release, feature/**, fix/**, fix-*]
    paths-ignore:
      - "*.md"
      - "_config.yml"
      - "docs/**"
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Install golangci-lint and gotestsum
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          go install gotest.tools/gotestsum@latest

      - name: Lint codebase (Machine Readable)
        run: |
          echo "=== Linting Codebase ==="
          $(go env GOPATH)/bin/golangci-lint cache clean
          $(go env GOPATH)/bin/golangci-lint run --timeout=5m --out-format json > lint-report.json || true
          # Print standard output for humans too
          $(go env GOPATH)/bin/golangci-lint run --timeout=5m

      # Without these assets controllers/suite_test.go sets skipControllerTests
      # and every Ginkgo spec in the controllers package is skipped - including
      # the fake-client ones that need no control plane - while the job still
      # reports success. CI=true (set by Actions) makes that skip fatal.
      - name: Set up envtest control plane
        run: |
          make envtest
          ASSETS=$(./bin/setup-envtest use "${ENVTEST_K8S_VERSION}" --bin-dir ./bin -p path)
          echo "Using envtest assets: ${ASSETS}"
          test -x "${ASSETS}/etcd" || { echo "::error::etcd missing from envtest assets"; exit 1; }
          echo "KUBEBUILDER_ASSETS=${ASSETS}" >> "$GITHUB_ENV"
        env:
          ENVTEST_K8S_VERSION: "1.26.0"

      - name: Run unit tests (Machine Readable)
        run: |
          gotestsum --format standard-verbose --jsonfile test-report.json -- -coverprofile=cover.out ./api/... ./pkg/... ./controllers/...

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./cover.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short

      - name: Build local Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: frappe-operator:local-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'frappe-operator:local-scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/release') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
