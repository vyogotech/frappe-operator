name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  e2e-tests:
    name: Run E2E Tests Before Release
    uses: ./.github/workflows/e2e-upgrades.yml

  build-and-release:
    name: Build and Release
    needs: e2e-tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=v${{ steps.version.outputs.VERSION }}

      - name: Generate consolidated install manifest
        run: |
          mkdir -p dist
          make manifests
          make kustomize
          # Create consolidated install.yaml using native kustomize
          ./bin/kustomize build config/default > dist/install.yaml
          
          # Create manifest archive
          tar czf dist/manifests-${{ steps.version.outputs.VERSION }}.tar.gz -C config .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz install.yaml > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release Notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Frappe Operator ${{ steps.version.outputs.VERSION }}
          
          ### Docker Images
          
          The operator image is available at:
          ```bash
          ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          ghcr.io/${{ github.repository }}:latest
          ```
          
          Pull the image:
          ```bash
          docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          ```
          
          ### Installation
          
          #### Quick Install
          ```bash
          kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.yaml
          ```
          
          #### Using Helm
          ```bash
          helm repo add frappe-operator https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/helm-repo
          helm install frappe-operator frappe-operator/frappe-operator --version ${{ steps.version.outputs.VERSION }}
          ```
          
          #### Using Operator Lifecycle Manager (OLM)
          ```bash
          kubectl create -f https://operatorhub.io/install/frappe-operator.yaml
          ```
          
          ### Docker Image Platforms
          - linux/amd64
          - linux/arm64
          
          EOF
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/install.yaml
            dist/*.tar.gz
            dist/SHA256SUMS
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # OpenShift OperatorHub (Red Hat community catalogue). Unlike operatorhub.io,
  # redhat-openshift-ecosystem/community-operators-prod documents no licence
  # requirement beyond the DCO sign-off, and hosts other source-available
  # operators. Opt-in: set the repository variable SUBMIT_TO_OPENSHIFT_COMMUNITY
  # to "true" and the secret COMMUNITY_OP_PAT (a PAT that can fork/push and open
  # PRs on GitHub) plus variables COMMUNITY_OP_AUTHOR_NAME/EMAIL (the DCO
  # identity: real name, must match the commit author). Runbook:
  # docs/openshift-community-operators.md
  submit-to-openshift-community:
    if: startsWith(github.ref, 'refs/tags/v') && vars.SUBMIT_TO_OPENSHIFT_COMMUNITY == 'true'
    name: Submit bundle to OpenShift community-operators-prod
    needs: build-and-release
    runs-on: ubuntu-latest
    env:
      UPSTREAM: redhat-openshift-ecosystem/community-operators-prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Operator SDK
        run: |
          export ARCH=$(case $(uname -m) in x86_64) echo -n amd64 ;; aarch64) echo -n arm64 ;; *) echo -n $(uname -m) ;; esac)
          export OS=$(uname | awk '{print tolower($0)}')
          curl -sSLo operator-sdk "https://github.com/operator-framework/operator-sdk/releases/download/v1.42.2/operator-sdk_${OS}_${ARCH}"
          chmod +x operator-sdk && sudo mv operator-sdk /usr/local/bin/operator-sdk

      - name: Fork and clone community-operators-prod
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_OP_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          gh repo fork "$UPSTREAM" --clone=true --remote=true -- community-operators-prod
          cd community-operators-prod
          git fetch upstream
          git checkout -B main upstream/main

      - name: Generate the OLM bundle
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # `replaces` must name a version the catalogue already has, so it is
          # taken from the fork's checkout of upstream, not from our git tags.
          PREVIOUS=$(ls community-operators-prod/operators/frappe-operator 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          make manifests
          make bundle VERSION="$VERSION" IMG="ghcr.io/${{ github.repository }}:v${VERSION}"
          python3 - "$VERSION" "$PREVIOUS" <<'PY'
          import sys
          version, previous = sys.argv[1], sys.argv[2]
          path = 'bundle/manifests/frappe-operator.clusterserviceversion.yaml'
          s = open(path).read()
          if 'containerImage:' not in s:
              s = s.replace('  annotations:\n', f'  annotations:\n    containerImage: ghcr.io/vyogotech/frappe-operator:v{version}\n', 1)
          if previous and '\n  replaces:' not in s:
              s = s.replace('\nspec:\n', f'\nspec:\n  replaces: frappe-operator.v{previous}\n', 1)
          open(path, 'w').write(s)
          PY
          operator-sdk bundle validate ./bundle --select-optional name=operatorhub
          operator-sdk bundle validate ./bundle --select-optional suite=operatorframework

      - name: Commit the bundle to a fork branch and open the PR
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_OP_PAT }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd community-operators-prod
          DIR="operators/frappe-operator/${VERSION}"
          mkdir -p "$DIR"
          cp -r ../bundle/manifests ../bundle/metadata ../bundle/tests "$DIR/"
          if [ ! -f operators/frappe-operator/ci.yaml ]; then
            printf -- '---\nreviewers:\n  - rmallam\n  - rakeshkumarmallam\nupdateGraph: replaces-mode\n' > operators/frappe-operator/ci.yaml
          fi
          git config user.name "${{ vars.COMMUNITY_OP_AUTHOR_NAME }}"
          git config user.email "${{ vars.COMMUNITY_OP_AUTHOR_EMAIL }}"
          git checkout -B "frappe-operator-${VERSION}"
          git add operators/frappe-operator
          git commit -s -m "operator frappe-operator (${VERSION})"
          git push -f origin "frappe-operator-${VERSION}"
          OWNER=$(gh api user --jq .login)
          gh pr create --repo "$UPSTREAM" \
            --title "operator frappe-operator (${VERSION})" \
            --body "Release of frappe-operator ${VERSION}. Bundle generated with operator-sdk from https://github.com/vyogotech/frappe-operator/releases/tag/v${VERSION}." \
            --head "${OWNER}:frappe-operator-${VERSION}" --base main \
            || echo "Pull request already exists or could not be created."

  # DISABLED as of v4.2.0: Frappe Operator is now licensed under the Elastic
  # License 2.0 (source-available, NOT an OSI-approved open-source license).
  # OperatorHub / k8s-operatorhub community-operators only accepts open-source
  # operators, so submitting the bundle there is no longer applicable and would
  # be rejected. Left in place (guarded off) rather than deleted; re-enable only
  # if the project ever returns to an OSI open-source license.
  submit-to-operatorhub:
    if: false
    name: Submit OLM Bundle to OperatorHub
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get Fork Owner Username
        id: fork_owner
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_OP_PAT }}
        run: |
          echo "USER=$(gh api user --jq .login)" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Install Operator SDK
        run: |
          export ARCH=$(case $(uname -m) in x86_64) echo -n amd64 ;; aarch64) echo -n arm64 ;; *) echo -n $(uname -m) ;; esac)
          export OS=$(uname | awk '{print tolower($0)}')
          export OPERATOR_SDK_DL_URL=https://github.com/operator-framework/operator-sdk/releases/download/v1.34.1
          curl -LO ${OPERATOR_SDK_DL_URL}/operator-sdk_${OS}_${ARCH}
          chmod +x operator-sdk_${OS}_${ARCH} && sudo mv operator-sdk_${OS}_${ARCH} /usr/local/bin/operator-sdk

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Generate OLM Bundle
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PREVIOUS_VERSION=$(git tag -l "v*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^v${{ steps.version.outputs.VERSION }}$" | head -n 1 | sed 's/^v//')
          export PREVIOUS_VERSION
          
          make manifests
          make bundle VERSION=${{ steps.version.outputs.VERSION }} IMG=ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.VERSION }}
          
          # Inject containerImage annotation and replaces upgrade path required by OperatorHub
          python3 -c "
          import os
          path = 'bundle/manifests/frappe-operator.clusterserviceversion.yaml'
          with open(path, 'r') as f:
              content = f.read()
          
          # Inject containerImage annotation
          target_ann = '  annotations:\n'
          replacement_ann = f'  annotations:\n    containerImage: ghcr.io/vyogotech/frappe-operator:v{os.environ[\"VERSION\"]}\n'
          content = content.replace(target_ann, replacement_ann, 1)
          
          # Inject replaces field if previous version exists
          prev = os.environ.get('PREVIOUS_VERSION')
          if prev:
              target_spec = 'spec:\n'
              replacement_spec = f'spec:\n  replaces: frappe-operator.v{prev}\n'
              content = content.replace(target_spec, replacement_spec, 1)
              
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Fork and Clone Community Operators Repository
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_OP_PAT }}
        run: |
          # Configure Git to use PAT for authentication
          git config --global url."https://x-access-token:${{ secrets.COMMUNITY_OP_PAT }}@github.com/".insteadOf "https://github.com/"
          
          # Fork (if not already forked) and clone the repository
          gh repo fork k8s-operatorhub/community-operators --clone
          cd community-operators

          # Add upstream (tolerating if it already exists) and sync the fork's main branch with upstream main
          git remote add upstream https://github.com/k8s-operatorhub/community-operators.git || true
          git fetch upstream
          git checkout main
          git reset --hard upstream/main
          git push origin main --force
          
          # Create directory for the new operator version
          OPERATOR_DIR="operators/frappe-operator/${{ steps.version.outputs.VERSION }}"
          mkdir -p "$OPERATOR_DIR"
          
          # Copy our local OLM bundle files into the cloned repository
          cp -r ../bundle/* "$OPERATOR_DIR/"
          
          # Create new branch, commit, and push to your fork
          git checkout -b frappe-operator-${{ steps.version.outputs.VERSION }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update frappe-operator to ${{ steps.version.outputs.VERSION }}"
          git push origin frappe-operator-${{ steps.version.outputs.VERSION }} --force
          
          # Open Pull Request targeting the community-operators master/main branch
          gh pr create \
            --repo k8s-operatorhub/community-operators \
            --title "Update frappe-operator to v${{ steps.version.outputs.VERSION }}" \
            --body "Automated release update for frappe-operator version ${{ steps.version.outputs.VERSION }}." \
            --head "${{ steps.fork_owner.outputs.USER }}:frappe-operator-${{ steps.version.outputs.VERSION }}" \
            --base main || echo "Pull Request already exists or could not be created."

