name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  e2e-tests:
    name: Run E2E Tests Before Release
    uses: ./.github/workflows/e2e-upgrades.yml

  build-and-release:
    name: Build and Release
    needs: e2e-tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate consolidated install manifest
        run: |
          mkdir -p dist
          make manifests
          make kustomize
          # Create consolidated install.yaml using native kustomize
          ./bin/kustomize build config/default > dist/install.yaml
          
          # Create manifest archive
          tar czf dist/manifests-${{ steps.version.outputs.VERSION }}.tar.gz -C config .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz install.yaml > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release Notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Frappe Operator ${{ steps.version.outputs.VERSION }}
          
          ### Docker Images
          
          The operator image is available at:
          ```bash
          ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          ghcr.io/${{ github.repository }}:latest
          ```
          
          Pull the image:
          ```bash
          docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          ```
          
          ### Installation
          
          #### Quick Install
          ```bash
          kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.yaml
          ```
          
          #### Using Helm
          ```bash
          helm repo add frappe-operator https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/helm-repo
          helm install frappe-operator frappe-operator/frappe-operator --version ${{ steps.version.outputs.VERSION }}
          ```
          
          #### Using Operator Lifecycle Manager (OLM)
          ```bash
          kubectl create -f https://operatorhub.io/install/frappe-operator.yaml
          ```
          
          ### Docker Image Platforms
          - linux/amd64
          - linux/arm64
          
          EOF
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/install.yaml
            dist/*.tar.gz
            dist/SHA256SUMS
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit-to-operatorhub:
    name: Submit OLM Bundle to OperatorHub
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Fork and Clone Community Operators Repository
        env:
          GH_TOKEN: ${{ secrets.COMMUNITY_OP_PAT }}
        run: |
          # Configure Git to use PAT for authentication
          git config --global url."https://x-access-token:${{ secrets.COMMUNITY_OP_PAT }}@github.com/".insteadOf "https://github.com/"
          
          # Fork (if not already forked) and clone the repository
          gh repo fork k8s-operatorhub/community-operators --clone
          cd community-operators
          
          # Create directory for the new operator version
          OPERATOR_DIR="operators/frappe-operator/${{ steps.version.outputs.VERSION }}"
          mkdir -p "$OPERATOR_DIR"
          
          # Copy our local OLM bundle files into the cloned repository
          cp -r ../bundle/* "$OPERATOR_DIR/"
          
          # Create new branch, commit, and push to your fork
          git checkout -b frappe-operator-${{ steps.version.outputs.VERSION }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update frappe-operator to ${{ steps.version.outputs.VERSION }}"
          git push origin frappe-operator-${{ steps.version.outputs.VERSION }} --force
          
          # Open Pull Request targeting the community-operators master/main branch
          gh pr create \
            --repo k8s-operatorhub/community-operators \
            --title "Update frappe-operator to v${{ steps.version.outputs.VERSION }}" \
            --body "Automated release update for frappe-operator version ${{ steps.version.outputs.VERSION }}." \
            --head "frappe-operator-${{ steps.version.outputs.VERSION }}" \
            --base main

