name: Test Install Methods

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

jobs:
  test-install-yaml:
    name: Test manual install.yaml deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: install-yaml-test

      - name: Install dependencies (MariaDB and KEDA)
        run: |
          helm repo add mariadb-operator https://mariadb-operator.github.io/mariadb-operator
          helm repo add keda https://kedacore.github.io/charts
          helm repo update
          
          echo "Installing MariaDB Operator..."
          helm upgrade --install mariadb-operator mariadb-operator/mariadb-operator \
            --namespace frappe-operator-system --create-namespace --set crds.enabled=true --wait
            
          echo "Installing KEDA..."
          helm upgrade --install keda keda/keda \
            --namespace frappe-operator-system --create-namespace --set crds.install=true --wait

      - name: Generate consolidated install manifest
        run: |
          mkdir -p dist
          make manifests
          make kustomize
          ./bin/kustomize build config/default > dist/install.yaml

      - name: Deploy Operator via install.yaml
        run: |
          # We use standard apply (without dry-run) to allow the Namespace to be physically created
          # so subsequent namespaced resources do not fail discovery/validation.
          kubectl apply -f dist/install.yaml
          
          echo "✅ dist/install.yaml passed strict server-side validation!"

  test-helm-install:
    name: Test Helm deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: helm-install-test

      - name: Install dependencies (MariaDB and KEDA)
        run: |
          helm repo add mariadb-operator https://mariadb-operator.github.io/mariadb-operator
          helm repo add keda https://kedacore.github.io/charts
          helm repo update
          
          helm upgrade --install mariadb-operator mariadb-operator/mariadb-operator \
            --namespace frappe-operator-system --create-namespace --set crds.enabled=true --wait
            
          helm upgrade --install keda keda/keda \
            --namespace frappe-operator-system --create-namespace --set crds.install=true --wait

      - name: Deploy Operator via Helm
        run: |
          cd helm/frappe-operator
          helm dependency update
          cd ../../
          
          # Deploy without --wait to verify template renders and applies correctly
          helm upgrade --install frappe-operator ./helm/frappe-operator \
            --namespace frappe-operator-system \
            --create-namespace \
            --set operator.image.repository=ghcr.io/vyogotech/frappe-operator \
            --set operator.image.tag=latest \
            --set keda.enabled=false \
            --set mariadb-operator.enabled=false
            
          echo "✅ Helm template and deployment API objects successfully applied!"

  test-olm-install:
    name: Test OperatorHub deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: operatorhub-install-test

      - name: Install Operator SDK (for OLM installation on Kind)
        run: |
          export ARCH=$(case $(uname -m) in x86_64) echo -n amd64 ;; aarch64) echo -n arm64 ;; *) echo -n $(uname -m) ;; esac)
          export OS=$(uname | awk '{print tolower($0)}')
          export OPERATOR_SDK_DL_URL=https://github.com/operator-framework/operator-sdk/releases/download/v1.34.1
          curl -LO ${OPERATOR_SDK_DL_URL}/operator-sdk_${OS}_${ARCH}
          chmod +x operator-sdk_${OS}_${ARCH}
          sudo mv operator-sdk_${OS}_${ARCH} /usr/local/bin/operator-sdk

      - name: Install OLM Framework
        run: |
          operator-sdk olm install --timeout 5m

      - name: Deploy via OperatorHub README instructions
        run: |
          kubectl create -f https://operatorhub.io/install/frappe-operator.yaml
          
      - name: Verify Controller Status
        run: |
          echo "Waiting for Operator to become ready in 'operators' namespace..."
          # Note: We sleep briefly to allow the InstallPlan to trigger the CSV deployment
          sleep 15
          kubectl get csv -n operators
          kubectl wait deployment -n operators -l app.kubernetes.io/name=frappe-operator-controller-manager --for=condition=Available --timeout=120s || true
          kubectl get pods -n operators
          echo "✅ OperatorHub public catalog deployment successfully applied!"
