name: Autoscaling Tests (KEDA + HPA)

on:
  push:
    branches:
      - main
      - master
      - feature/autoscaling
      - feature/**autoscaling**
    paths:
      - "api/v1alpha1/shared_types.go"
      - "api/v1alpha1/frappebench_types.go"
      - "controllers/scaling_provider.go"
      - "controllers/keda_provider.go"
      - "controllers/hpa_provider.go"
      - "controllers/*_test.go"
      - ".github/workflows/autoscaling-test.yml"
      - "test-autoscaling-helm.sh"
      - "examples/test-*.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "controllers/hpa_provider*.go"
      - "api/v1alpha1/**"
  workflow_dispatch:

jobs:
  autoscaling-unit-tests:
    name: Autoscaling Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Autoscaling Unit Tests
        run: |
          echo "Running Autoscaling Unit Tests..."
          go test -v -run "TestComponentAutoscaling|TestKEDAScalingConfig|TestHPAScalingConfig|TestResolveProvider|TestKEDAProvider|TestHPAProvider|TestGetHPAMetricName" ./controllers/ -coverprofile=autoscaling-total-coverage.out

      - name: Verify Coverage File
        run: |
          if [ ! -f autoscaling-total-coverage.out ]; then
            echo "ERROR: autoscaling-total-coverage.out was not generated"
            exit 1
          fi

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=autoscaling-total-coverage.out | grep total | awk '{print $3}' | sed 's/%//' || echo "0")
          echo "Autoscaling code coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 0.5" | bc -l) )); then
            echo "ERROR: Autoscaling coverage ${COVERAGE}% is below 0.5% threshold"
            exit 1
          fi

  autoscaling-e2e-keda:
    name: E2E Test - KEDA Autoscaling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: autoscaling-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "latest"

      - name: Run KEDA E2E Test
        run: |
          chmod +x test-autoscaling-helm.sh
          ./test-autoscaling-helm.sh keda --cluster-name frappe-keda-e2e

      - name: Capture logs on failure
        if: failure()
        run: |
          echo "=== KEDA Operator Logs ==="
          kubectl logs -n frappe-operator-system -l app.kubernetes.io/name=keda-operator --tail=100 || true
          echo ""
          echo "=== Frappe Operator Logs ==="
          kubectl logs -n frappe-operator-system -l control-plane=controller-manager --tail=100 || true
          echo ""
          echo "=== FrappeBench Status ==="
          kubectl get frappebench -A -o yaml || true
          echo ""
          echo "=== Pods ==="
          kubectl get pods -A || true

  autoscaling-e2e-hpa:
    name: E2E Test - HPA Autoscaling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: autoscaling-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "latest"

      - name: Run HPA E2E Test
        run: |
          chmod +x test-autoscaling-helm.sh
          ./test-autoscaling-helm.sh hpa --cluster-name frappe-hpa-e2e

      - name: Capture logs on failure
        if: failure()
        run: |
          echo "=== HPA Events ==="
          kubectl describe hpa -n default || true
          echo ""
          echo "=== Frappe Operator Logs ==="
          kubectl logs -n frappe-operator-system -l control-plane=controller-manager --tail=100 || true
          echo ""
          echo "=== FrappeBench Status ==="
          kubectl get frappebench -A -o yaml || true
          echo ""
          echo "=== Pods ==="
          kubectl get pods -A || true

  autoscaling-e2e-provider-switch:
    name: E2E Test - Provider Switch (KEDA to HPA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: autoscaling-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "latest"

      - name: Run Provider Switch E2E Test
        run: |
          chmod +x test-autoscaling-helm.sh
          ./test-autoscaling-helm.sh provider-switch --cluster-name frappe-switch-e2e

      - name: Capture logs on failure
        if: failure()
        run: |
          echo "=== KEDA Operator Logs ==="
          kubectl logs -n frappe-operator-system -l app.kubernetes.io/name=keda-operator --tail=100 || true
          echo ""
          echo "=== Frappe Operator Logs ==="
          kubectl logs -n frappe-operator-system -l control-plane=controller-manager --tail=100 || true
          echo ""
          echo "=== ScaledObjects ==="
          kubectl get scaledobjects -A || true
          echo ""
          echo "=== HPAs ==="
          kubectl get hpa -A || true
          echo ""
          echo "=== FrappeBench Status ==="
          kubectl get frappebench -A -o yaml || true
          echo ""
          echo "=== Pods ==="
          kubectl get pods -A || true
