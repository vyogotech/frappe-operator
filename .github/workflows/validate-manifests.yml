name: Validate Example Manifests

on:
  push:
    paths:
      - 'examples/**'
      - 'deploy/**'
      - 'api/**'
      # All of config/, not just crd/: this job diffs install.yaml against
      # `kustomize build config/default`, so a change under config/rbac/ or
      # config/manager/ can put them out of sync just as easily.
      - 'config/**'
      - 'install.yaml'
      - 'Makefile'
      - '.github/workflows/validate-manifests.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'deploy/**'
      - 'api/**'
      # All of config/, not just crd/: this job diffs install.yaml against
      # `kustomize build config/default`, so a change under config/rbac/ or
      # config/manager/ can put them out of sync just as easily.
      - 'config/**'
      - 'install.yaml'
      - 'Makefile'
      - '.github/workflows/validate-manifests.yml'

jobs:
  validate:
    name: Structural Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Verify install.yaml is in sync
        run: |
          make manifests
          make kustomize
          ./bin/kustomize build config/default > temp-install.yaml
          diff -u install.yaml temp-install.yaml

      - name: Setup Kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: manifest-validation
          
      - name: Install Operator CRDs
        run: |
          make manifests
          make install
          
      - name: Apply core prerequisites
        run: |
          kubectl create namespace frappe
          # We might need mariadb and keda CRDs to successfully dry-run test files that reference them
          # Install mariadb CRDs
          kubectl apply -f https://github.com/mariadb-operator/mariadb-operator/releases/latest/download/crds.yaml
          # Install Percona PostgreSQL Operator CRDs (for the postgres examples that
          # reference pgv2.percona.com/v2 PerconaPGCluster). CRDs only — no operator.
          kubectl apply --server-side -f https://raw.githubusercontent.com/percona/percona-postgresql-operator/v2.3.1/deploy/crd.yaml
          
      - name: Validate examples/ (Server Dry Run)
        run: |
          for file in examples/*.yaml; do
            echo "---"
            echo "Validating $file"
            
            # Skip pure templates containing unexpanded domain bindings that would fail normal syntax checks
            if [[ "$file" == *"template"* ]]; then
               echo "Skipping template file $file"
               continue
            fi
            
            # Ensure specified namespaces exist before structural dry run applies the object
            if grep -q "namespace:" "$file"; then
              ns=$(awk '/namespace:/ {print $2}' "$file" | head -1)
              kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f - || true
            fi
            
            # Some examples reference CRDs owned by optional third-party operators
            # (StackGres, Percona, KEDA). Those are not installed on this
            # validation cluster, and requiring them would mean installing every
            # optional operator just to lint YAML. Skip such files instead of
            # failing: this job exists to catch malformed manifests of our own.
            missing=""
            for kind in $(grep -E '^kind:' "$file" | awk '{print $2}' | sort -u); do
              if ! kubectl explain "$kind" >/dev/null 2>&1; then
                missing="$missing $kind"
              fi
            done
            if [ -n "$missing" ]; then
              echo "Skipping $file - no CRD on this cluster for:$missing"
              continue
            fi

            # Perform structurally bounded dry-run compilation against the active API server
            kubectl apply -f "$file" --dry-run=server || exit 1
          done
          
      - name: Validate deploy/ (Server Dry Run)
        run: |
          for file in deploy/*.yaml; do
            echo "---"
            echo "Validating $file"
            
            if grep -q "namespace:" "$file"; then
              ns=$(awk '/namespace:/ {print $2}' "$file" | head -1)
              kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f - || true
            fi
            
            kubectl apply -f "$file" --dry-run=server || exit 1
          done
