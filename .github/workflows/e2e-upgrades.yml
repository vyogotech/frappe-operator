name: E2E Upgrade Testing

on:
  push:
    branches: [main, master, release, develop, 'feat/**']
    paths:
      - 'helm/**'
      - 'controllers/**'
      - 'api/**'
      - 'pkg/**'
      - 'scripts/**'
      - 'test/**'
      - 'tests/**'
      - '.github/workflows/e2e-upgrades.yml'
  pull_request:
    branches: [main, master, release]
  workflow_dispatch:
  workflow_call:

jobs:
  test-css-upgrade:
    name: Standard Upgrade (CSS Validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # These jobs load the multi-gigabyte Frappe bench image into kind, and
        # `kind load docker-image` stages it through `docker save` into /tmp,
        # needing roughly twice the image size free. A stock ubuntu-latest
        # runner does not have that, so every job here failed with "no space
        # left on device" before reaching any actual test. Reclaim the
        # preinstalled toolchains this repository never uses.
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          # Install Kind
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Setup Helm
        uses: azure/setup-helm@v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm --prefix tests/e2e install
          npx --prefix tests/e2e playwright install chromium --with-deps

      - name: Run Test
        run: |
          chmod +x scripts/test-css-upgrade.sh
          ./scripts/test-css-upgrade.sh

      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-css-upgrade
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7

