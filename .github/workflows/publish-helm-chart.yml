name: Publish Helm Chart

on:
  push:
    branches:
      - release
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine chart version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            # Remove 'v' prefix if present
            VERSION=${VERSION#v}
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from Chart.yaml or use git tag
            VERSION=$(grep '^version:' helm/frappe-operator/Chart.yaml | awk '{print $2}' | tr -d '"')
            if [ -z "$VERSION" ]; then
              VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "1.0.0")
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Chart version: $VERSION"

      - name: Update Helm dependencies
        run: |
          cd helm/frappe-operator
          grep 'repository:' Chart.yaml | awk '{print $2}' | tr -d '"' | sort -u | {
            i=0
            while read -r url; do
              [ -n "$url" ] || continue
              i=$((i + 1))
              helm repo add "frappe-dep-$i" "$url" --force-update >/dev/null
            done
          }
          helm dependency build
          cd ../..

      - name: Package Helm chart
        run: |
          mkdir -p docs/helm-repo
          echo "📦 Packaging Helm chart version ${{ steps.version.outputs.version }}..."
          helm package helm/frappe-operator \
            --destination docs/helm-repo \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "v${{ steps.version.outputs.version }}"
          echo "✅ Chart packaged successfully"
          ls -la docs/helm-repo/*.tgz

      - name: Fetch existing Helm packages from gh-pages
        run: |
          mkdir -p docs/helm-repo
          echo "🔍 Fetching existing .tgz packages from gh-pages so all published versions stay indexed..."
          git fetch origin gh-pages 2>/dev/null || true
          for pkg in $(git ls-tree --name-only origin/gh-pages helm-repo/ 2>/dev/null | grep '\.tgz$' || true); do
            base=$(basename "$pkg")
            if [ ! -f "docs/helm-repo/$base" ]; then
              git show "origin/gh-pages:$pkg" > "docs/helm-repo/$base"
              echo "  restored $base"
            fi
          done

      - name: Generate Helm repository index
        run: |
          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/helm-repo"
          echo "🔍 Generating Helm repo index for $REPO_URL..."
          helm repo index docs/helm-repo --url "$REPO_URL"
          echo "✅ Index generated"
          grep -E "version:" docs/helm-repo/index.yaml || true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/helm-repo
          destination_dir: helm-repo
          keep_files: true
          commit_message: "chore: publish Helm chart v${{ steps.version.outputs.version }}"

      - name: Verify chart package
        run: |
          echo "✅ Chart packaged and dynamically published to gh-pages branch!"
          ls -lh docs/helm-repo/*.tgz
