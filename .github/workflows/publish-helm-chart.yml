name: Publish Helm Chart

on:
  push:
    branches:
      - release
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine chart version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            # Remove 'v' prefix if present
            VERSION=${VERSION#v}
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from Chart.yaml or use git tag
            VERSION=$(grep '^version:' helm/frappe-operator/Chart.yaml | awk '{print $2}' | tr -d '"')
            if [ -z "$VERSION" ]; then
              VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "1.0.0")
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Chart version: $VERSION"

      - name: Update Helm dependencies
        run: |
          cd helm/frappe-operator
          helm dependency update
          cd ../..

      - name: Package Helm chart
        run: |
          mkdir -p docs/helm-repo
          echo "📦 Packaging Helm chart version ${{ steps.version.outputs.version }}..."
          helm package helm/frappe-operator \
            --destination docs/helm-repo \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}"
          echo "✅ Chart packaged successfully"
          ls -la docs/helm-repo/*.tgz

      - name: Fetch previous Helm index
        run: |
          mkdir -p docs/helm-repo
          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/helm-repo"
          echo "🔍 Fetching previous index.yaml from $REPO_URL to merge..."
          curl -sSL -f -o docs/helm-repo/index.yaml "$REPO_URL/index.yaml" || echo "⚠️ No previous index found or HTTP 404, generating a fresh one."

      - name: Generate Helm repository index
        run: |
          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/helm-repo"
          echo "🔍 Generating Helm repo index for $REPO_URL..."
          if [ -f docs/helm-repo/index.yaml ]; then
            helm repo index docs/helm-repo --url "$REPO_URL" --merge docs/helm-repo/index.yaml
          else
            helm repo index docs/helm-repo --url "$REPO_URL"
          fi
          echo "✅ Index generated"
          cat docs/helm-repo/index.yaml | head -20

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/helm-repo
          destination_dir: helm-repo
          keep_files: true
          commit_message: "chore: publish Helm chart v${{ steps.version.outputs.version }}"

      - name: Verify chart package
        run: |
          echo "✅ Chart packaged and dynamically published to gh-pages branch!"
          ls -lh docs/helm-repo/*.tgz
