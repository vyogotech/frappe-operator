name: Minishift Test (OpenShift)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'helm/**'
      - 'controllers/**'
      - 'api/**'
      - 'scripts/test-minishift.sh'
      - '.github/workflows/minishift-test.yml'

jobs:
  minishift-test:
    runs-on: ubuntu-22.04 # ubuntu-20.04 is deprecated and removed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
          cache: true

      - name: Create OpenShift Cluster
        uses: redhat-actions/oc-cluster-up@v1
        with:
          oc_version: '3.11'

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Run Minishift Test Script
        run: |
          chmod +x scripts/test-minishift.sh
          ./scripts/test-minishift.sh
        env:
          # Use a stable image for the test if building locally is too slow/complex in 3.11
          # Otherwise, the script will use the default tag 'latest'
          IMAGE_TAG: latest
