apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-console-plugin
  namespace: frappe-operator-system
  labels:
    app.kubernetes.io/name: frappe-console-plugin
    app.kubernetes.io/part-of: frappe-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frappe-console-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe-console-plugin
    spec:
      containers:
        - name: plugin
          image: image-registry.openshift-image-registry.svc:5000/frappe-operator-system/frappe-console-plugin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9443
              name: https
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /var/serving-cert
              name: serving-cert
              readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: serving-cert
          secret:
            defaultMode: 420
            secretName: frappe-console-plugin-cert
            optional: true
