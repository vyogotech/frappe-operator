apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frappe-console-ingress
  namespace: frappe-operator-system
  labels:
    app.kubernetes.io/name: frappe-console-plugin
    app.kubernetes.io/part-of: frappe-operator
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: frappe-console.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frappe-console-plugin
                port:
                  number: 8080
  tls:
    - hosts:
        - frappe-console.example.com
      secretName: frappe-console-tls-cert
