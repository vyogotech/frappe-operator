apiVersion: vyogo.tech/v1alpha1
kind: FrappeBench
metadata:
  name: my-bench-v6
  namespace: default
  annotations:
    frappe.tech/storage-access-mode: ReadWriteOnce
spec:
  frappeVersion: "v15.0.0"
  
  # Use custom image
  imageConfig:
    repository: ghcr.io/vyogotech/frappe_base
    tag: v3.1.0
    pullPolicy: Always

  # Apps to install
  apps:
    - name: frappe
      source: image
    - name: erpnext
      source: image
  
  # Component replicas (minimal for development)
  componentAutoscaling:
    gunicorn:
      enabled: false
      staticReplicas: 1
    nginx:
      enabled: false
      staticReplicas: 1
    socketio:
      enabled: false
      staticReplicas: 1
    scheduler:
      enabled: false
      staticReplicas: 1
    worker-default:
      enabled: false
      staticReplicas: 1
    worker-short:
      enabled: false
      staticReplicas: 1
    worker-long:
      enabled: false
      staticReplicas: 1
  
  # Storage configuration
  storageSize: "10Gi"
  
  # Security context: Ensure volume is writable by group 0
  security:
    podSecurityContext:
      fsGroup: 0
