apiVersion: vyogo.tech/v1alpha1
kind: FrappeBench
metadata:
  name: my-bench-v6
  namespace: default
  annotations:
    frappe.tech/storage-access-mode: ReadWriteOnce
spec:
  frappeVersion: "v15.0.0"
  
  # Use custom image
  imageConfig:
    repository: ghcr.io/vyogotech/frappe_base
    tag: v3.1.0
    pullPolicy: Always

  # Apps to install
  apps:
    - name: frappe
      source: image
    - name: erpnext
      source: image
  
  # Component replicas (minimal for development)
  componentReplicas:
    gunicorn: 1
    nginx: 1
    socketio: 1
    scheduler: 1
    workers:
      default: 1
      short: 1
      long: 1
  
  # Storage configuration
  storageSize: "10Gi"
  
  # Security context: Ensure volume is writable by group 0
  security:
    podSecurityContext:
      fsGroup: 0
