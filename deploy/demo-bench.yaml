apiVersion: vyogo.tech/v1
kind: FrappeBench
metadata:
  name: demo-bench
  namespace: frappe-demo
spec:
  frappeVersion: "15.0.0"
  
  security:
    podSecurityContext: {}

  imageConfig:
    repository: ghcr.io/vyogotech/frappe_base
    tag: v3.1.0
    pullPolicy: Always
  
  # Permanent Fix for OpenShift RWX

  storageClassName: ocs-external-storagecluster-cephfs
  storageSize: 5Gi
