apiVersion: vyogo.tech/v1alpha1
kind: FrappeBench
metadata:
  name: vyogo-bench
  namespace: frappe
spec:
  frappeVersion: "15.0.0"
  imageConfig:
    repository: ghcr.io/vyogotech/frappe_base
    tag: sha-7bc7484
    pullPolicy: Always
  
  # External Redis configuration
  redisConfig:
    type: redis
    external: true
    host: 64.227.178.150
    port: 6379
    connectionSecretRef:
      name: external-redis-creds
  
  # Autoscaling configuration (HPA Only)
  # This replaces static componentReplicas
  componentAutoscaling:
    gunicorn:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      provider: hpa
      hpa:
        metric: cpu
        targetUtilization: 75
        scaleUpStabilization: 0
        scaleDownStabilization: 60
    
    nginx:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      provider: hpa
      hpa:
        metric: cpu
        targetUtilization: 80
        scaleUpStabilization: 0
        scaleDownStabilization: 60
    
    workerDefault:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      provider: hpa
      hpa:
        metric: cpu
        targetUtilization: 85
    
    workerShort:
      enabled: false # Static replicas
      staticReplicas: 1

    workerLong:
      enabled: false
      staticReplicas: 1
      
    socketio:
      enabled: false
      staticReplicas: 1
  
  storageSize: 2Gi
