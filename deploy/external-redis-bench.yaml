apiVersion: vyogo.tech/v1alpha1
kind: FrappeBench
metadata:
  name: external-redis-bench
  namespace: frappe
spec:
  frappeVersion: "15.0.0"
  imageConfig:
    repository: ghcr.io/rmallam/frappe_docker
    tag: sha-7bc7484
    pullPolicy: Always
  
  # External Redis configuration
  redisConfig:
    external: true
    host: redis-external.frappe.svc.cluster.local
    port: 6379
    connectionSecretRef:
      name: external-redis-creds
  
  # Define replicas for components
  componentReplicas:
    gunicorn: 1
    nginx: 1
    socketio: 1
    workerDefault: 1
    workerLong: 1
    workerShort: 1
  
  storageSize: 2Gi
