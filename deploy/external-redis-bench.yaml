apiVersion: vyogo.tech/v1alpha1
kind: FrappeBench
metadata:
  name: external-redis-bench
  namespace: frappe
spec:
  frappeVersion: "15.0.0"
  imageConfig:
    repository: ghcr.io/vyogotech/frappe_base
    tag: v3.1.0
    pullPolicy: Always
  
  # External Redis configuration
  redisConfig:
    type: redis
    external: true
    host: redis-external.redis.svc.cluster.local
    port: 6379
    connectionSecretRef:
      name: external-redis-creds
  
  # Define replicas for components
  componentAutoscaling:
    gunicorn:
      enabled: false
      staticReplicas: 1
    nginx:
      enabled: false
      staticReplicas: 1
    socketio:
      enabled: false
      staticReplicas: 1
    worker-default:
      enabled: false
      staticReplicas: 1
    worker-long:
      enabled: false
      staticReplicas: 1
    worker-short:
      enabled: false
      staticReplicas: 1
  
  storageSize: 2Gi
