apiVersion: v1
kind: Namespace
metadata:
  name: redis
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-creds
  namespace: redis
type: Opaque
stringData:
  password: mock_redis_password
---
apiVersion: v1
kind: Service
metadata:
  name: redis-external
  namespace: redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-external
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-external
  namespace: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-external
  template:
    metadata:
      labels:
        app: redis-external
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server"]
        args: ["--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-creds
              key: password
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
