apiVersion: vyogo.tech/v1alpha1
kind: FrappeSite
metadata:
  name: prod-site
  namespace: frappe
spec:
  benchRef:
    name: external-redis-bench
  siteName: prod.site.com
  dbConfig:
    provider: external
    host: frappe-mariadb.mariadb.svc.cluster.local
    port: "3306"
    dbName: prod_db  # <--- Simulating the PROD database restoration target
    connectionSecretRef:
      name: external-mariadb-creds
  apps:
    - erpnext
  skipInit: true