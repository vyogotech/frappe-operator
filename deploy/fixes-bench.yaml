apiVersion: vyogo.tech/v1alpha1
kind: FrappeBench
metadata:
  name: central-bench
  namespace: frappe
spec:
  frappeVersion: "15.0.0"
  imageConfig:
    repository: ghcr.io/atxinvox/central-site
    tag: v3.1.0
    pullPolicy: Always
    pullSecrets:
      - name: ghcr-secret
  storageSize: 2Gi

  # Apps to install
  apps:
    - name: frappe
      source: image
    - name: erpnext
      source: image

  # Component replicas (minimal for development)
  componentReplicas:
    gunicorn: 1
    nginx: 1
    socketio: 1
    scheduler: 0
    workers:
      default: 1
      short: 0
      long: 0
  podConfig:
    labels:
      e2e-custom-label: verified
