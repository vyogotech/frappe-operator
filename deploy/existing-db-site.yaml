apiVersion: vyogo.tech/v1alpha1
kind: FrappeSite
metadata:
  name: external-mock-site
  namespace: frappe
spec:
  siteName: external-mock.apps.crc.testing
  benchRef:
    name: external-redis-bench
  dbConfig:
    provider: external
    host: frappe-mariadb.mariadb.svc.cluster.local
    port: "3306"
    connectionSecretRef:
      name: external-mariadb-creds
  skipInit: true
