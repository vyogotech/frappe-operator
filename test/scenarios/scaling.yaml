apiVersion: vyogo.tech/v1alpha1
kind: FrappeBench
metadata:
  name: scaling-bench
spec:
  frappeVersion: "15"
  imageConfig:
    repository: ghcr.io/vyogotech/frappe_base
    tag: latest
    pullPolicy: Always
  componentAutoscaling:
    gunicorn:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
    nginx:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
      provider: hpa
  storageSize: 2Gi
---
apiVersion: vyogo.tech/v1alpha1
kind: FrappeSite
metadata:
  name: scaling-site
spec:
  benchRef:
    name: scaling-bench
  siteName: scaling.test.local
  dbConfig:
    mode: shared
    mariadbRef:
      name: frappe-mariadb
      namespace: mariadb
